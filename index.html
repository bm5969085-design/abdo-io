<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عبده.io - لعبة الثعبان والبقاء</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      background: #090d16;
      cursor: crosshair;
    }
    #ui {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.75);
      padding: 12px 20px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }
    .overlay p {
      font-size: 1.2rem;
      color: #94a3b8;
      margin-bottom: 25px;
      max-width: 400px;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>طول عبده: <span id="score">10</span></div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>عبده.io 🐍</h1>
    <p>حرك ثعبانك بالموس أو اللمس لتأكل الأشكال الملونة وتكبر! احذر من لمس الحدود الحمراء أو الأعداء الأكبر منك!</p>
    <button class="btn" onclick="startGame()">ابدأ اللعب الآن</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 style="color: #ef4444;" id="deathReason">تم التهام عبده! 💥</h1>
    <p>وصل طول الثعبان النهائي إلى: <span id="finalScore">0</span></p>
    <button class="btn" onclick="startGame()">العب مرة أخرى</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let isPlaying = false;
    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    
    // إعدادات اللاعب (الثعبان)
    let snake = {
      body: [],
      length: 15,
      radius: 12,
      color: '#38bdf8'
    };

    let foods = [];
    let enemies = [];
    
    const FOOD_COUNT = 220; // زيادة كمية الطعام وتكثيفه
    const ENEMY_COUNT = 10;
    const MAP_SIZE = 1400;  // تصغير الخريطة حبة لتقريب الأكل والأعداء
    const SNAKE_SPEED = 2.2; // تقليل السرعة لتصبح أهدأ ومريحة

    const colors = ['#f43f5e', '#a855f7', '#22c55e', '#eab308', '#06b6d4', '#ec4899', '#f97316'];
    const shapes = ['circle', 'square', 'star'];

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    function initGame() {
      const startX = MAP_SIZE / 2;
      const startY = MAP_SIZE / 2;
      
      snake.body = [];
      snake.length = 15;
      snake.radius = 12;

      for (let i = 0; i < snake.length; i++) {
        snake.body.push({ x: startX, y: startY + i * 5 });
      }

      // إنشاء طعام أكبر وفي أماكن متقاربة وأشكال متنوعة
      foods = [];
      for (let i = 0; i < FOOD_COUNT; i++) {
        foods.push(generateFood());
      }

      // إنشاء أعداء بألوان مختلفة ومتنوعة
      enemies = [];
      for (let i = 0; i < ENEMY_COUNT; i++) {
        enemies.push({
          x: Math.random() * (MAP_SIZE - 200) + 100,
          y: Math.random() * (MAP_SIZE - 200) + 100,
          radius: Math.random() * 15 + 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 1.8,
          vy: (Math.random() - 0.5) * 1.8
        });
      }
    }

    function generateFood() {
      return {
        x: Math.random() * (MAP_SIZE - 60) + 30,
        y: Math.random() * (MAP_SIZE - 60) + 30,
        radius: Math.random() * 5 + 7, // حجم الطعام أكبر وأوضح
        color: colors[Math.floor(Math.random() * colors.length)],
        shape: shapes[Math.floor(Math.random() * shapes.length)]
      };
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      initGame();
      isPlaying = true;
    }

    function gameOver(reason) {
      isPlaying = false;
      document.getElementById('deathReason').innerText = reason || 'خسرت اللعبة!';
      document.getElementById('finalScore').innerText = Math.floor(snake.length);
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function update() {
      if (!isPlaying) return;

      const head = { ...snake.body[0] };
      
      const targetX = head.x + (mouse.x - canvas.width / 2);
      const targetY = head.y + (mouse.y - canvas.height / 2);
      
      const dx = targetX - head.x;
      const dy = targetY - head.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 3) {
        head.x += (dx / dist) * SNAKE_SPEED;
        head.y += (dy / dist) * SNAKE_SPEED;
      }

      // شرط الخسارة عند لمس الخط الأحمر الخارجي
      if (
        head.x <= snake.radius || 
        head.x >= MAP_SIZE - snake.radius || 
        head.y <= snake.radius || 
        head.y >= MAP_SIZE - snake.radius
      ) {
        gameOver('اصطدمت بالحدود الحمراء! 🛑');
        return;
      }

      snake.body.unshift(head);
      while (snake.body.length > snake.length) {
        snake.body.pop();
      }

      // أكل الطعام
      foods.forEach((food, index) => {
        const d = Math.hypot(head.x - food.x, head.y - food.y);
        if (d < snake.radius + food.radius) {
          snake.length += 2;
          snake.radius = Math.min(25, 12 + snake.length * 0.05); // كبر بسيط في العرض
          foods.splice(index, 1);
          foods.push(generateFood());
        }
      });

      // حركة الأعداء والتصادم
      enemies.forEach((enemy) => {
        enemy.x += enemy.vx;
        enemy.y += enemy.vy;

        if (enemy.x < enemy.radius || enemy.x > MAP_SIZE - enemy.radius) enemy.vx *= -1;
        if (enemy.y < enemy.radius || enemy.y > MAP_SIZE - enemy.radius) enemy.vy *= -1;

        const d = Math.hypot(head.x - enemy.x, head.y - enemy.y);
        if (d < snake.radius + enemy.radius) {
          if (snake.radius > enemy.radius * 1.1) {
            snake.length += 8;
            enemy.x = Math.random() * (MAP_SIZE - 100) + 50;
            enemy.y = Math.random() * (MAP_SIZE - 100) + 50;
            enemy.color = colors[Math.floor(Math.random() * colors.length)];
          } else {
            gameOver('التهمك أحد الأعداء! 💥');
          }
        }
      });

      document.getElementById('score').innerText = Math.floor(snake.length);
    }

    function drawFood(food) {
      ctx.fillStyle = food.color;
      ctx.beginPath();
      
      if (food.shape === 'circle') {
        ctx.arc(food.x, food.y, food.radius, 0, Math.PI * 2);
      } else if (food.shape === 'square') {
        ctx.rect(food.x - food.radius, food.y - food.radius, food.radius * 2, food.radius * 2);
      } else if (food.shape === 'star') {
        // رسم نجمة ثلاثية أو أركان مميزة
        for (let i = 0; i < 5; i++) {
          ctx.lineTo(
            food.x + Math.cos((18 + i * 72) * Math.PI / 180) * food.radius,
            food.y - Math.sin((18 + i * 72) * Math.PI / 180) * food.radius
          );
          ctx.lineTo(
            food.x + Math.cos((54 + i * 72) * Math.PI / 180) * (food.radius / 2),
            food.y - Math.sin((54 + i * 72) * Math.PI / 180) * (food.radius / 2)
          );
        }
      }
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!snake.body[0]) return;

      const head = snake.body[0];

      ctx.save();
      ctx.translate(canvas.width / 2 - head.x, canvas.height / 2 - head.y);

      // رسم شبكة الخريطة
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1.5;
      const gridSize = 60;
      for (let x = 0; x < MAP_SIZE; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, MAP_SIZE);
        ctx.stroke();
      }
      for (let y = 0; y < MAP_SIZE; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(MAP_SIZE, y);
        ctx.stroke();
      }

      // رسم الحدود الحمراء القاتلة
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 8;
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 15;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);
      ctx.shadowBlur = 0;

      // رسم الأكل المتنوع
      foods.forEach(food => drawFood(food));

      // رسم الأعداء المتنوعين الألوان
      enemies.forEach(enemy => {
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fillStyle = enemy.color;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // رسم الثعبان (جسم بدون كتابة أسماء)
      if (isPlaying) {
        for (let i = snake.body.length - 1; i >= 0; i--) {
          const pt = snake.body[i];
          const segmentRadius = Math.max(4, snake.radius - (i * 0.15));
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, segmentRadius, 0, Math.PI * 2);
          ctx.fillStyle = i === 0 ? '#0284c7' : snake.color;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
