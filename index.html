<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عبده.io - لعبة البقاء والنمو</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      background: #1e293b;
      cursor: crosshair;
    }
    #ui {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.75);
      padding: 12px 20px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }
    .overlay p {
      font-size: 1.2rem;
      color: #94a3b8;
      margin-bottom: 25px;
      max-width: 400px;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>حجم عبده: <span id="score">10</span></div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>عبده.io 🚀</h1>
    <p>حرك عبده بالموس أو باللمس لتلتهم الطعام وتكبر، وتجنب الأعداء الأكبر منك!</p>
    <button class="btn" onclick="startGame()">ابدأ اللعب الآن</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 style="color: #ef4444;">تم التهام عبده! 💥</h1>
    <p>وصل حجم عبده النهائي إلى: <span id="finalScore">0</span></p>
    <button class="btn" onclick="startGame()">العب مرة أخرى</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let isPlaying = false;
    let score = 10;
    let player = { x: 0, y: 0, radius: 15, color: '#38bdf8' };
    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    let foods = [];
    let enemies = [];
    const FOOD_COUNT = 150;
    const ENEMY_COUNT = 8;
    const MAP_SIZE = 2000;

    const colors = ['#f43f5e', '#a855f7', '#22c55e', '#eab308', '#06b6d4', '#ec4899'];

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    function initGame() {
      player.x = MAP_SIZE / 2;
      player.y = MAP_SIZE / 2;
      player.radius = 15;
      score = 10;

      foods = [];
      for (let i = 0; i < FOOD_COUNT; i++) {
        foods.push({
          x: Math.random() * MAP_SIZE,
          y: Math.random() * MAP_SIZE,
          radius: Math.random() * 4 + 3,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      enemies = [];
      for (let i = 0; i < ENEMY_COUNT; i++) {
        enemies.push({
          x: Math.random() * MAP_SIZE,
          y: Math.random() * MAP_SIZE,
          radius: Math.random() * 20 + 10,
          color: '#ef4444',
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2
        });
      }
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      initGame();
      isPlaying = true;
    }

    function gameOver() {
      isPlaying = false;
      document.getElementById('finalScore').innerText = Math.floor(player.radius);
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function update() {
      if (!isPlaying) return;

      const targetX = player.x + (mouse.x - canvas.width / 2);
      const targetY = player.y + (mouse.y - canvas.height / 2);
      
      const dx = targetX - player.x;
      const dy = targetY - player.y;
      const dist = Math.hypot(dx, dy);

      const speed = Math.max(1.5, 6 - player.radius * 0.05);

      if (dist > 5) {
        player.x += (dx / dist) * speed;
        player.y += (dy / dist) * speed;
      }

      player.x = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.y));

      foods.forEach((food, index) => {
        const d = Math.hypot(player.x - food.x, player.y - food.y);
        if (d < player.radius + food.radius) {
          player.radius += 0.3;
          foods.splice(index, 1);
          foods.push({
            x: Math.random() * MAP_SIZE,
            y: Math.random() * MAP_SIZE,
            radius: Math.random() * 4 + 3,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      });

      enemies.forEach((enemy) => {
        enemy.x += enemy.vx;
        enemy.y += enemy.vy;

        if (enemy.x < enemy.radius || enemy.x > MAP_SIZE - enemy.radius) enemy.vx *= -1;
        if (enemy.y < enemy.radius || enemy.y > MAP_SIZE - enemy.radius) enemy.vy *= -1;

        const d = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (d < player.radius + enemy.radius) {
          if (player.radius > enemy.radius * 1.1) {
            player.radius += enemy.radius * 0.4;
            enemy.x = Math.random() * MAP_SIZE;
            enemy.y = Math.random() * MAP_SIZE;
            enemy.radius = player.radius * (Math.random() * 0.8 + 0.4);
          } else if (enemy.radius > player.radius * 1.1) {
            gameOver();
          }
        }
      });

      document.getElementById('score').innerText = Math.floor(player.radius);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 2;
      const gridSize = 80;
      for (let x = 0; x < MAP_SIZE; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, MAP_SIZE);
        ctx.stroke();
      }
      for (let y = 0; y < MAP_SIZE; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(MAP_SIZE, y);
        ctx.stroke();
      }

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 5;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      foods.forEach(food => {
        ctx.beginPath();
        ctx.arc(food.x, food.y, food.radius, 0, Math.PI * 2);
        ctx.fillStyle = food.color;
        ctx.fill();
      });

      enemies.forEach(enemy => {
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fillStyle = enemy.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      if (isPlaying) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold ' + Math.max(12, player.radius * 0.6) + 'px Segoe UI';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('عبده', player.x, player.y);
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
