<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عبده.io - لعبة الثعابين المتقدمة</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      background: #090d16;
      cursor: crosshair;
    }
    #ui {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.8);
      padding: 12px 20px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 5;
    }
    #status {
      font-size: 14px;
      color: #38bdf8;
      margin-top: 4px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }
    .overlay p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 25px;
      max-width: 450px;
      line-height: 1.6;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>طول عبده: <span id="score">15</span></div>
    <div id="status">السرعة: العادية</div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>عبده.io 🐍</h1>
    <p>
      تحدّ الثعابين الأخرى في خريطة واسعة!<br>
      ⚡ <b>الأصفر:</b> سرعة فائقة | 💥 <b>البنفسجي:</b> نمو ضخم متسارع
    </p>
    <button class="btn" onclick="startGame()">ابدأ اللعب الآن</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 style="color: #ef4444;" id="deathReason">انتهت اللعبة! 💥</h1>
    <p>وصل طول الثعبان النهائي إلى: <span id="finalScore">0</span></p>
    <button class="btn" onclick="startGame()">العب مرة أخرى</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let isPlaying = false;
    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    const MAP_SIZE = 2600;
    const FOOD_COUNT = 350;
    const POWERUP_COUNT = 25;
    const BOT_COUNT = 12;

    let baseSpeed = 2.2;
    let currentSpeed = baseSpeed;
    let speedBoostTimer = 0;

    const colors = ['#f43f5e', '#a855f7', '#22c55e', '#eab308', '#06b6d4', '#ec4899', '#f97316'];

    let playerSnake = {
      body: [],
      length: 15,
      radius: 12,
      color: '#38bdf8'
    };

    let foods = [];
    let powerups = [];
    let botSnakes = [];

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    function initGame() {
      const startX = MAP_SIZE / 2;
      const startY = MAP_SIZE / 2;

      playerSnake.body = [];
      playerSnake.length = 15;
      playerSnake.radius = 12;
      currentSpeed = baseSpeed;

      for (let i = 0; i < playerSnake.length; i++) {
        playerSnake.body.push({ x: startX, y: startY + i * 5 });
      }

      foods = [];
      for (let i = 0; i < FOOD_COUNT; i++) {
        foods.push(generateFood());
      }

      powerups = [];
      for (let i = 0; i < POWERUP_COUNT; i++) {
        powerups.push(generatePowerup());
      }

      botSnakes = [];
      for (let i = 0; i < BOT_COUNT; i++) {
        botSnakes.push(generateBotSnake());
      }
    }

    function generateFood() {
      return {
        x: Math.random() * (MAP_SIZE - 100) + 50,
        y: Math.random() * (MAP_SIZE - 100) + 50,
        radius: Math.random() * 4 + 6,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function generatePowerup() {
      const types = ['speed', 'growth'];
      const type = types[Math.floor(Math.random() * types.length)];
      return {
        x: Math.random() * (MAP_SIZE - 100) + 50,
        y: Math.random() * (MAP_SIZE - 100) + 50,
        radius: 12,
        type: type,
        color: type === 'speed' ? '#eab308' : '#a855f7'
      };
    }

    function generateBotSnake() {
      const startX = Math.random() * (MAP_SIZE - 200) + 100;
      const startY = Math.random() * (MAP_SIZE - 200) + 100;
      const length = Math.floor(Math.random() * 20) + 10;
      const color = colors[Math.floor(Math.random() * colors.length)];
      
      let body = [];
      for (let i = 0; i < length; i++) {
        body.push({ x: startX, y: startY + i * 5 });
      }

      return {
        body: body,
        length: length,
        radius: 11,
        color: color,
        angle: Math.random() * Math.PI * 2
      };
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      initGame();
      isPlaying = true;
    }

    function gameOver(reason) {
      isPlaying = false;
      document.getElementById('deathReason').innerText = reason || 'انتهت اللعبة!';
      document.getElementById('finalScore').innerText = Math.floor(playerSnake.length);
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function update() {
      if (!isPlaying) return;

      if (speedBoostTimer > 0) {
        speedBoostTimer--;
        currentSpeed = baseSpeed * 1.8;
        document.getElementById('status').innerText = 'السرعة: فائقة ⚡';
      } else {
        currentSpeed = baseSpeed;
        document.getElementById('status').innerText = 'السرعة: العادية';
      }

      const head = { ...playerSnake.body[0] };
      const targetX = head.x + (mouse.x - canvas.width / 2);
      const targetY = head.y + (mouse.y - canvas.height / 2);

      const dx = targetX - head.x;
      const dy = targetY - head.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 3) {
        head.x += (dx / dist) * currentSpeed;
        head.y += (dy / dist) * currentSpeed;
      }

      if (
        head.x <= playerSnake.radius || 
        head.x >= MAP_SIZE - playerSnake.radius || 
        head.y <= playerSnake.radius || 
        head.y >= MAP_SIZE - playerSnake.radius
      ) {
        gameOver('اصطدمت بالحدود الحمراء! 🛑');
        return;
      }

      playerSnake.body.unshift(head);
      while (playerSnake.body.length > playerSnake.length) {
        playerSnake.body.pop();
      }

      foods.forEach((food, index) => {
        const d = Math.hypot(head.x - food.x, head.y - food.y);
        if (d < playerSnake.radius + food.radius) {
          playerSnake.length += 1.5;
          foods.splice(index, 1);
          foods.push(generateFood());
        }
      });

      powerups.forEach((powerup, index) => {
        const d = Math.hypot(head.x - powerup.x, head.y - powerup.y);
        if (d < playerSnake.radius + powerup.radius) {
          if (powerup.type === 'speed') {
            speedBoostTimer = 250;
          } else if (powerup.type === 'growth') {
            playerSnake.length += 12;
          }
          powerups.splice(index, 1);
          powerups.push(generatePowerup());
        }
      });

      botSnakes.forEach((bot, botIndex) => {
        let botHead = { ...bot.body[0] };
        
        if (Math.random() < 0.03) {
          bot.angle += (Math.random() - 0.5) * 1.5;
        }

        botHead.x += Math.cos(bot.angle) * 1.8;
        botHead.y += Math.sin(bot.angle) * 1.8;

        if (botHead.x < 50 || botHead.x > MAP_SIZE - 50) bot.angle = Math.PI - bot.angle;
        if (botHead.y < 50 || botHead.y > MAP_SIZE - 50) bot.angle = -bot.angle;

        bot.body.unshift(botHead);
        while (bot.body.length > bot.length) {
          bot.body.pop();
        }

        const d = Math.hypot(head.x - botHead.x, head.y - botHead.y);
        if (d < playerSnake.radius + bot.radius) {
          if (playerSnake.length >= bot.length) {
            playerSnake.length += bot.length * 0.5;
            botSnakes[botIndex] = generateBotSnake();
          } else {
            gameOver('اصطدمت بثعبان أكبر منك! 🐍💥');
          }
        }
      });

      document.getElementById('score').innerText = Math.floor(playerSnake.length);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!playerSnake.body[0]) return;

      const head = playerSnake.body[0];

      ctx.save();
      ctx.translate(canvas.width / 2 - head.x, canvas.height / 2 - head.y);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1.5;
      const gridSize = 80;
      for (let x = 0; x < MAP_SIZE; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, MAP_SIZE);
        ctx.stroke();
      }
      for (let y = 0; y < MAP_SIZE; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(MAP_SIZE, y);
        ctx.stroke();
      }

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      foods.forEach(food => {
        ctx.beginPath();
        ctx.arc(food.x, food.y, food.radius, 0, Math.PI * 2);
        ctx.fillStyle = food.color;
        ctx.fill();
      });

      powerups.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px Segoe UI';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type === 'speed' ? '⚡' : '💥', p.x, p.y);
      });

      botSnakes.forEach(bot => {
        for (let i = bot.body.length - 1; i >= 0; i--) {
          const pt = bot.body[i];
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, bot.radius, 0, Math.PI * 2);
          ctx.fillStyle = bot.color;
          ctx.fill();
        }
      });

      if (isPlaying) {
        for (let i = playerSnake.body.length - 1; i >= 0; i--) {
          const pt = playerSnake.body[i];
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, playerSnake.radius, 0, Math.PI * 2);
          ctx.fillStyle = i === 0 ? '#0284c7' : playerSnake.color;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
