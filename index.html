<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake.io - النسخة الأصلية 🐍</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      background: #0b0f19;
      cursor: crosshair;
    }
    
    /* واجهة العرض UI */
    .hud-panel {
      position: absolute;
      color: #fff;
      background: rgba(15, 23, 42, 0.85);
      padding: 10px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      pointer-events: none;
      z-index: 5;
    }

    #ui {
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 150px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
    }

    #leaderboard {
      top: 15px;
      left: 15px;
      min-width: 180px;
    }

    #leaderboard h3 {
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 6px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    /* الخريطة المصغرة */
    #minimapContainer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 0.85);
      z-index: 5;
    }

    #minimap {
      width: 100%;
      height: 100%;
    }

    /* الشاشات */
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.99) 100%);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    .overlay h1 {
      font-size: 3rem;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.3));
    }

    .overlay p {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .input-group {
      width: 100%;
      max-width: 360px;
      margin-bottom: 15px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 20px;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 30px;
      color: white;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
    }

    .skins-wrapper {
      max-width: 420px;
      width: 100%;
      background: rgba(30, 41, 59, 0.5);
      padding: 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .skins-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
      padding: 4px;
    }

    .skin-item {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
    }

    .skin-item.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
    }

    .btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      padding: 14px 45px;
      font-size: 1.25rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none !important;
    }

    /* زر الاندفاع المخصص للموبايل */
    #mobileBoostBtn {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: radial-gradient(circle, #f59e0b, #d97706);
      color: white;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 8;
      touch-action: manipulation;
      border: 3px solid rgba(255,255,255,0.4);
      display: none;
    }

    @media (max-width: 768px) {
      #mobileBoostBtn { display: flex; }
    }
  </style>
</head>
<body>

  <div id="ui" class="hud-panel">
    <div class="stat-row">
      <span>الاحياء:</span>
      <span id="aliveCount" style="color: #ef4444;">20</span>
    </div>
    <div class="stat-row">
      <span>الطول:</span>
      <span id="score" style="color: #38bdf8;">10</span>
    </div>
  </div>

  <div id="leaderboard" class="hud-panel">
    <h3>👑 المتصدرون</h3>
    <div id="lb-list"></div>
  </div>

  <div id="minimapContainer">
    <canvas id="minimap"></canvas>
  </div>

  <div id="startScreen" class="overlay">
    <h1>Snake.io 🐍</h1>
    <p>كن أكبر ثعبان واقضِ على الجميع!</p>
    
    <div class="input-group">
      <input type="text" id="playerNameInput" value="عبد الله" maxlength="12">
    </div>

    <div class="skins-wrapper">
      <div class="skins-grid" id="skinsGrid"></div>
    </div>

    <button class="btn" onclick="startGame()">ابدأ اللعب 🚀</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 id="endTitle" style="color: #ef4444;">انتهت اللعبة! 💥</h1>
    <p>الطول النهائي: <span id="finalScore" style="color: #38bdf8; font-weight: bold;">0</span></p>
    <button class="btn" onclick="startGame()">العب مرة أخرى 🔄</button>
  </div>

  <div id="mobileBoostBtn">⚡</div>

  <canvas id="gameCanvas"></canvas>

  <script>
    // --- الأصوات ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      if (!audioCtx) audioCtx = new AudioCtx();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'eat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.06);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
          osc.start(now); osc.stop(now + 0.06);
        } else if (type === 'explode') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    // --- الإعدادات والكانفاس ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const minimapCanvas = document.getElementById('minimap');
    const miniCtx = minimapCanvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      minimapCanvas.width = 100;
      minimapCanvas.height = 100;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const FOOD_COLORS = ['#38bdf8', '#22c55e', '#a855f7', '#eab308', '#f43f5e', '#f97316', '#06b6d4', '#ec4899'];
    const SKINS = [
      { emoji: '🐍', color: '#22c55e', bodyColors: ['#22c55e', '#16a34a'] },
      { emoji: '🐉', color: '#ef4444', bodyColors: ['#ef4444', '#f97316'] },
      { emoji: '🐲', color: '#a855f7', bodyColors: ['#a855f7', '#38bdf8'] },
      { emoji: '🦁', color: '#eab308', bodyColors: ['#eab308', '#ca8a04'] },
      { emoji: '🤖', color: '#38bdf8', bodyColors: ['#38bdf8', '#0284c7'] }
    ];

    const BOT_NAMES = ['المرعب', 'النووي', 'الصاروخ', 'الكوبرا', 'الفايكنج', 'الزعيم', 'الشبَح', 'النمر', 'العاصفة', 'الفارس', 'العملاق', 'السموراي', 'الصارم', 'الصقر', 'المدمر', 'الجنرال', 'السيّد', 'المفترس', 'الزلزال'];

    let selectedSkinIndex = 0;
    let isBoosting = false;
    let isPlaying = false;

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    const MAP_SIZE = 2600;
    const FOOD_COUNT = 300;
    const TOTAL_BOTS = 19; // 19 بوت + اللاعب = 20 ثعبان

    let foods = [];
    let botSnakes = [];

    let playerSnake = {
      name: 'عبد الله',
      isAlive: true,
      body: [],
      length: 12,
      radius: 12,
      angle: 0,
      skin: SKINS[0]
    };

    function renderSkins() {
      const grid = document.getElementById('skinsGrid');
      grid.innerHTML = '';
      SKINS.forEach((skin, i) => {
        const item = document.createElement('div');
        item.className = `skin-item ${i === selectedSkinIndex ? 'active' : ''}`;
        item.innerText = skin.emoji;
        item.onclick = () => {
          selectedSkinIndex = i;
          renderSkins();
        };
        grid.appendChild(item);
      });
    }
    renderSkins();

    window.addEventListener('mousedown', () => isBoosting = true);
    window.addEventListener('mouseup', () => isBoosting = false);
    
    const boostBtn = document.getElementById('mobileBoostBtn');
    boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
    boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; });

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    function generateFood(x, y, value = 1) {
      return {
        x: x || Math.random() * (MAP_SIZE - 100) + 50,
        y: y || Math.random() * (MAP_SIZE - 100) + 50,
        color: FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)],
        radius: value > 1 ? 6 + value : 4,
        value: value
      };
    }

    function generateBotSnake(id) {
      const startX = Math.random() * (MAP_SIZE - 400) + 200;
      const startY = Math.random() * (MAP_SIZE - 400) + 200;
      const length = Math.floor(Math.random() * 15) + 10;
      const skin = SKINS[Math.floor(Math.random() * SKINS.length)];
      
      let body = [];
      for (let i = 0; i < length; i++) {
        body.push({ x: startX, y: startY + i * 4 });
      }

      return {
        id: `bot_${id}`,
        name: BOT_NAMES[id - 1] || `لاعب ${id}`,
        isAlive: true,
        body: body,
        length: length,
        radius: 12,
        skin: skin,
        angle: Math.random() * Math.PI * 2,
        changeDirTimer: 0
      };
    }

    function initGame() {
      const name = document.getElementById('playerNameInput').value.trim();
      playerSnake.name = name !== '' ? name : 'عبد الله';
      playerSnake.isAlive = true;
      playerSnake.skin = SKINS[selectedSkinIndex];
      playerSnake.body = [];
      playerSnake.length = 12;
      playerSnake.radius = 12;

      const startX = MAP_SIZE / 2;
      const startY = MAP_SIZE / 2;

      for (let i = 0; i < playerSnake.length; i++) {
        playerSnake.body.push({ x: startX, y: startY + i * 4 });
      }

      foods = [];
      for (let i = 0; i < FOOD_COUNT; i++) foods.push(generateFood());

      botSnakes = [];
      for (let i = 0; i < TOTAL_BOTS; i++) botSnakes.push(generateBotSnake(i + 1));
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      initGame();
      isPlaying = true;
    }

    function gameOver(isWin, reason) {
      isPlaying = false;
      playSound('explode');
      document.getElementById('finalScore').innerText = Math.floor(playerSnake.length);
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    // تحويل كامل جسم الثعبان لمجمعات طعام كبيرة عند الاصطدام (Snake.io Exact Feature)
    function explodeSnake(snake) {
      playSound('explode');
      snake.isAlive = false;
      snake.body.forEach((pt) => {
        foods.push(generateFood(pt.x + (Math.random() - 0.5) * 20, pt.y + (Math.random() - 0.5) * 20, 2.5));
      });
    }

    function distSq(x1, y1, x2, y2) {
      const dx = x1 - x2;
      const dy = y1 - y2;
      return dx * dx + dy * dy;
    }

    function update() {
      if (!isPlaying) return;

      let aliveBots = botSnakes.filter(b => b.isAlive);
      let aliveTotal = aliveBots.length + (playerSnake.isAlive ? 1 : 0);
      document.getElementById('aliveCount').innerText = aliveTotal;

      if (playerSnake.isAlive && aliveBots.length === 0) {
        gameOver(true);
        return;
      }

      // الاندفاع واستهلاك الطول
      let activeBoost = isBoosting && playerSnake.length > 8;
      let speed = activeBoost ? 4.5 : 2.5;

      if (activeBoost && playerSnake.isAlive) {
        playerSnake.length -= 0.03;
        if (Math.random() < 0.3) {
          const tail = playerSnake.body[playerSnake.body.length - 1];
          foods.push(generateFood(tail.x, tail.y, 0.8));
        }
      }

      // تحريك اللاعب
      if (playerSnake.isAlive) {
        const head = { ...playerSnake.body[0] };
        const targetX = head.x + (mouse.x - canvas.width / 2);
        const targetY = head.y + (mouse.y - canvas.height / 2);

        const targetAngle = Math.atan2(targetY - head.y, targetX - head.x);
        playerSnake.angle = targetAngle;

        head.x += Math.cos(playerSnake.angle) * speed;
        head.y += Math.sin(playerSnake.angle) * speed;

        // الاصطدام بالحدود
        if (head.x <= playerSnake.radius || head.x >= MAP_SIZE - playerSnake.radius || head.y <= playerSnake.radius || head.y >= MAP_SIZE - playerSnake.radius) {
          explodeSnake(playerSnake);
          gameOver(false, 'اصطدمت بالحدود!');
          return;
        }

        playerSnake.body.unshift(head);
        while (playerSnake.body.length > playerSnake.length) playerSnake.body.pop();

        // أكل الطعام
        for (let i = foods.length - 1; i >= 0; i--) {
          const food = foods[i];
          const hitRadius = playerSnake.radius + food.radius;
          if (distSq(head.x, head.y, food.x, food.y) < hitRadius * hitRadius) {
            playerSnake.length += food.value * 0.4;
            playSound('eat');
            foods[i] = generateFood();
          }
        }
      }

      // تحريك وتحديث البوتات
      aliveBots.forEach((bot) => {
        let botHead = { ...bot.body[0] };

        // تفادي الحدود
        if (botHead.x < 150) bot.angle = 0;
        else if (botHead.x > MAP_SIZE - 150) bot.angle = Math.PI;
        else if (botHead.y < 150) bot.angle = Math.PI / 2;
        else if (botHead.y > MAP_SIZE - 150) bot.angle = -Math.PI / 2;
        else {
          bot.changeDirTimer--;
          if (bot.changeDirTimer <= 0) {
            bot.angle += (Math.random() - 0.5) * 1.5;
            bot.changeDirTimer = Math.floor(Math.random() * 30) + 15;
          }
        }

        botHead.x += Math.cos(bot.angle) * 2.2;
        botHead.y += Math.sin(bot.angle) * 2.2;

        if (botHead.x <= bot.radius || botHead.x >= MAP_SIZE - bot.radius || botHead.y <= bot.radius || botHead.y >= MAP_SIZE - bot.radius) {
          explodeSnake(bot);
          return;
        }

        bot.body.unshift(botHead);
        while (bot.body.length > bot.length) bot.body.pop();

        // أكل الطعام للبوت
        for (let i = foods.length - 1; i >= 0; i--) {
          const f = foods[i];
          const hitRadius = bot.radius + f.radius;
          if (distSq(botHead.x, botHead.y, f.x, f.y) < hitRadius * hitRadius) {
            bot.length += f.value * 0.4;
            foods[i] = generateFood();
          }
        }

        // تصادم البوت بجسم اللاعب -> موت البوت
        if (playerSnake.isAlive) {
          const hitR2 = (bot.radius + playerSnake.radius * 0.7) ** 2;
          for (let k = 1; k < playerSnake.body.length; k++) {
            if (distSq(botHead.x, botHead.y, playerSnake.body[k].x, playerSnake.body[k].y) < hitR2) {
              explodeSnake(bot);
              playerSnake.length += bot.length * 0.3;
              break;
            }
          }
        }

        // تصادم رأس اللاعب بجسم البوت -> موت اللاعب
        if (playerSnake.isAlive && bot.isAlive) {
          const head = playerSnake.body[0];
          const hitR2 = (playerSnake.radius + bot.radius * 0.7) ** 2;
          for (let k = 0; k < bot.body.length; k++) {
            if (distSq(head.x, head.y, bot.body[k].x, bot.body[k].y) < hitR2) {
              explodeSnake(playerSnake);
              gameOver(false);
              break;
            }
          }
        }

        // تصادم البوتات فيما بينها
        aliveBots.forEach(otherBot => {
          if (bot.id !== otherBot.id && bot.isAlive && otherBot.isAlive) {
            const hitR2 = (bot.radius + otherBot.radius * 0.7) ** 2;
            for (let k = 0; k < otherBot.body.length; k += 2) {
              if (distSq(botHead.x, botHead.y, otherBot.body[k].x, otherBot.body[k].y) < hitR2) {
                explodeSnake(bot);
                otherBot.length += bot.length * 0.3;
                break;
              }
            }
          }
        });
      });

      document.getElementById('score').innerText = Math.floor(playerSnake.length);
      updateLeaderboard();
    }

    function updateLeaderboard() {
      let allSnakes = [];
      if (playerSnake.isAlive) allSnakes.push({ id: 'player', name: playerSnake.name, length: Math.floor(playerSnake.length) });
      
      botSnakes.forEach(b => {
        if (b.isAlive) allSnakes.push({ id: b.id, name: b.name, length: Math.floor(b.length) });
      });

      allSnakes.sort((a, b) => b.length - a.length);

      const lbList = document.getElementById('lb-list');
      lbList.innerHTML = '';
      allSnakes.slice(0, 5).forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'lb-item';
        div.style.color = item.id === 'player' ? '#38bdf8' : '#fff';
        div.innerHTML = `<span>${index === 0 ? '👑 ' : ''}${index + 1}. ${item.name}</span><span>${item.length}</span>`;
        lbList.appendChild(div);
      });
    }

    function drawSnake(ctx, snake, isKing = false) {
      if (!snake.isAlive || !snake.body || snake.body.length === 0) return;

      // رسم أجزاء الجسم المتصلة بسلاسة
      for (let i = snake.body.length - 1; i >= 0; i--) {
        const pt = snake.body[i];
        const color = snake.skin.bodyColors[i % snake.skin.bodyColors.length];
        
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, snake.radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }

      // رسم اسم اللاعب ورأس الثعبان والتاج
      const head = snake.body[0];
      const next = snake.body[1] || head;
      const angle = Math.atan2(head.y - next.y, head.x - next.x);

      ctx.save();
      ctx.translate(head.x, head.y);

      // رسم التاج للمتصدر الأول 👑 (King Snake Indicator)
      if (isKing) {
        ctx.font = '16px Segoe UI Emoji';
        ctx.textAlign = 'center';
        ctx.fillText('👑', 0, -snake.radius - 18);
      }

      ctx.font = 'bold 11px Segoe UI';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(snake.name, 0, -snake.radius - 6);

      ctx.rotate(angle + Math.PI / 2);
      ctx.font = `${snake.radius * 2.1}px Segoe UI Emoji, Apple Color Emoji`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(snake.skin.emoji, 0, 0);

      ctx.restore();
    }

    function drawMinimap() {
      miniCtx.clearRect(0, 0, 100, 100);
      const scale = 100 / MAP_SIZE;

      miniCtx.fillStyle = '#ef4444';
      botSnakes.forEach(b => {
        if (b.isAlive && b.body[0]) miniCtx.fillRect(b.body[0].x * scale, b.body[0].y * scale, 2.5, 2.5);
      });

      if (playerSnake.isAlive && playerSnake.body[0]) {
        miniCtx.fillStyle = '#38bdf8';
        miniCtx.beginPath();
        miniCtx.arc(playerSnake.body[0].x * scale, playerSnake.body[0].y * scale, 3.5, 0, Math.PI * 2);
        miniCtx.fill();
      }
    }

    function draw() {
      ctx.fillStyle = '#0b0f19';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!playerSnake.body[0]) return;

      const head = playerSnake.isAlive ? playerSnake.body[0] : { x: MAP_SIZE / 2, y: MAP_SIZE / 2 };
      const zoom = Math.max(0.6, 1 - playerSnake.length * 0.0006);

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-head.x, -head.y);

      // شبكة الخلفية المربّعة
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1.5;
      const gridSize = 100;
      for (let x = 0; x <= MAP_SIZE; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
      }
      for (let y = 0; y <= MAP_SIZE; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, MAP_SIZE); ctx.stroke();
      }

      // الحدود
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      // رسم كرات الطعام المضيئة
      foods.forEach(food => {
        ctx.beginPath();
        ctx.arc(food.x, food.y, food.radius, 0, Math.PI * 2);
        ctx.fillStyle = food.color;
        ctx.fill();
      });

      // إيجاد من هو الملك (المتصدر الأول)
      let allSnakes = [];
      if (playerSnake.isAlive) allSnakes.push(playerSnake);
      botSnakes.forEach(b => { if (b.isAlive) allSnakes.push(b); });
      allSnakes.sort((a, b) => b.length - a.length);
      const kingSnake = allSnakes[0];

      botSnakes.forEach(bot => drawSnake(ctx, bot, kingSnake && kingSnake.id === bot.id));
      if (playerSnake.isAlive) drawSnake(ctx, playerSnake, kingSnake && kingSnake === playerSnake);

      ctx.restore();

      drawMinimap();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
