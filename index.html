<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عبده.io - باتل رويال الأساطير 🏆</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      background: #030712;
      cursor: crosshair;
    }
    
    /* واجهة المستخدم UI */
    .hud-panel {
      position: absolute;
      color: #fff;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      pointer-events: none;
      z-index: 5;
    }

    #ui {
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 160px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
    }

    .boost-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .boost-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      transition: width 0.1s linear;
    }

    #leaderboard {
      top: 15px;
      left: 15px;
      min-width: 190px;
    }

    #leaderboard h3 {
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
      font-weight: 600;
    }

    /* الخريطة المصغرة */
    #minimapContainer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.5);
      background: rgba(15, 23, 42, 0.85);
      z-index: 5;
    }

    #minimap {
      width: 100%;
      height: 100%;
    }

    /* شاشات البداية والنهاية */
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.94) 0%, rgba(3, 7, 18, 0.98) 100%);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    .overlay h1 {
      font-size: 3rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .skins-wrapper {
      max-width: 500px;
      width: 100%;
      background: rgba(30, 41, 59, 0.5);
      padding: 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 22px;
    }

    .skins-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      max-height: 180px;
      overflow-y: auto;
      padding: 4px;
    }

    .skin-item {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .skin-item:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.15);
    }

    .skin-item.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .page-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .page-btn.active {
      background: #0284c7;
    }

    .btn {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: white;
      border: none;
      padding: 15px 45px;
      font-size: 1.25rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(79, 70, 229, 0.5);
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none !important;
    }

    /* زر التحكم بالموبايل */
    #mobileBoostBtn {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: radial-gradient(circle, #f59e0b, #d97706);
      color: white;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 8;
      touch-action: manipulation;
      border: 3px solid rgba(255,255,255,0.4);
      display: none;
    }

    @media (max-width: 768px) {
      #mobileBoostBtn { display: flex; }
    }
  </style>
</head>
<body>

  <div id="ui" class="hud-panel">
    <div class="stat-row">
      <span>الأحياء:</span>
      <span id="aliveCount" style="color: #ef4444; font-size: 16px;">25</span>
    </div>
    <div class="stat-row">
      <span>الطول:</span>
      <span id="score" style="color: #38bdf8;">15</span>
    </div>
    <div class="stat-row">
      <span>التعزيز:</span>
      <span id="boostText" style="color: #f59e0b;">100%</span>
    </div>
    <div class="boost-bar-container">
      <div id="boostBar" class="boost-bar-fill"></div>
    </div>
    <div id="activeBuffs" style="font-size: 11px; color: #a855f7; margin-top:2px;"></div>
  </div>

  <div id="leaderboard" class="hud-panel">
    <h3>🏆 أساطير الساحة</h3>
    <div id="lb-list"></div>
  </div>

  <div id="minimapContainer">
    <canvas id="minimap"></canvas>
  </div>

  <div id="startScreen" class="overlay">
    <h1>عبده.io - باتل رويال 👑</h1>
    <p>25 ثعباناً سينزلون الساحة... بطل واحد فقط سيبقى حياً!</p>
    
    <div class="skins-wrapper">
      <div class="skins-grid" id="skinsGrid"></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <button class="btn" onclick="startGame()">ابدأ المعركة 🔥</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 id="endTitle" style="font-size: 3.5rem;">انتهت الجولة! 💥</h1>
    <p id="endSubText">النتيجة النهائية والطول: <span id="finalScore" style="color: #38bdf8; font-weight: bold;">0</span></p>
    <button class="btn" onclick="startGame()">العب مرة أخرى 🔄</button>
  </div>

  <div id="mobileBoostBtn">⚡</div>

  <canvas id="gameCanvas"></canvas>

  <script>
    // --- الصوت الديناميكي ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'eat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'powerup') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'explode') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'win') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 0.5);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
          osc.start(now); osc.stop(now + 0.5);
        }
      } catch (e) {}
    }

    // --- إعدادات اللعبة والكانفاس ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // تحسين أداء الكانفاس
    const minimapCanvas = document.getElementById('minimap');
    const miniCtx = minimapCanvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      minimapCanvas.width = 110;
      minimapCanvas.height = 110;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const FOOD_ITEMS = ['🍔','🍕','🌭','🍟','🌮','🍩','🍪','🍏','🍎','🍌','🍉','🍇','🍓','🍒','🍍'];
    const POWERUP_TYPES = [
      { type: 'magnet', icon: '🧲', color: '#38bdf8' },
      { type: 'shield', icon: '🛡️', color: '#a855f7' },
      { type: 'double', icon: '⚡', color: '#eab308' }
    ];

    const EMOJI_SKINS = ['🐍','🐉','🐲','🦁','🐯','🦊','🦝','🐻','🐼','🐰','🐱','🐶','🐺','🤖','👽','👻','💀','👹','👿','🎃','💩','👾','🛸','🚀','🦅','🦈'];
    const BODY_COLORS = ['#38bdf8', '#22c55e', '#a855f7', '#eab308', '#f43f5e', '#f97316', '#06b6d4', '#ec4899'];
    const BOT_NAMES = ['صقر الساحة', 'المرعب', 'الشبَح', 'النمر', 'العاصفة', 'المحتاس', 'الفارس', 'النووي', 'ثعبان الليل', 'البيكست', 'الجنرال', 'الساموراي', 'الزعيم', 'الصاروخ', 'الشرس', 'السيّد', 'المفترس', 'الغواص', 'الزلزال', 'الصارم', 'المدمر', 'العملاق', 'الكوبرا', 'الفايكنج'];

    let selectedSkinIndex = 0;
    let currentPage = 0;
    const itemsPerPage = 18;

    let isBoosting = false;
    let isPlaying = false;

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    const MAP_SIZE = 2800;
    const FOOD_COUNT = 220;
    const TOTAL_BOTS = 24;

    let particles = [];
    let foods = [];
    let powerups = [];
    let botSnakes = [];

    let playerSnake = {
      name: 'عبده الأسطوري',
      isAlive: true,
      body: [],
      length: 15,
      radius: 14,
      emoji: EMOJI_SKINS[0],
      color: BODY_COLORS[0],
      boostEnergy: 100,
      buffs: { magnet: 0, shield: 0, double: 0 }
    };

    function renderSkinsPage(page) {
      currentPage = page;
      const grid = document.getElementById('skinsGrid');
      grid.innerHTML = '';
      
      const start = page * itemsPerPage;
      const end = Math.min(start + itemsPerPage, EMOJI_SKINS.length);

      for (let i = start; i < end; i++) {
        const item = document.createElement('div');
        item.className = `skin-item ${i === selectedSkinIndex ? 'active' : ''}`;
        item.innerText = EMOJI_SKINS[i];
        item.onclick = () => {
          selectedSkinIndex = i;
          renderSkinsPage(currentPage);
        };
        grid.appendChild(item);
      }

      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';
      const totalPages = Math.ceil(EMOJI_SKINS.length / itemsPerPage);

      for (let p = 0; p < totalPages; p++) {
        const pBtn = document.createElement('button');
        pBtn.className = `page-btn ${p === currentPage ? 'active' : ''}`;
        pBtn.innerText = p + 1;
        pBtn.onclick = () => renderSkinsPage(p);
        pagination.appendChild(pBtn);
      }
    }
    renderSkinsPage(0);

    window.addEventListener('mousedown', () => isBoosting = true);
    window.addEventListener('mouseup', () => isBoosting = false);
    
    const boostBtn = document.getElementById('mobileBoostBtn');
    boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
    boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; });

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    function generateFood(x, y) {
      return {
        x: x || Math.random() * (MAP_SIZE - 120) + 60,
        y: y || Math.random() * (MAP_SIZE - 120) + 60,
        icon: FOOD_ITEMS[Math.floor(Math.random() * FOOD_ITEMS.length)],
        radius: 10,
        pulse: Math.random() * Math.PI * 2
      };
    }

    function generatePowerup() {
      const p = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
      return {
        x: Math.random() * (MAP_SIZE - 200) + 100,
        y: Math.random() * (MAP_SIZE - 200) + 100,
        type: p.type,
        icon: p.icon,
        color: p.color,
        radius: 15
      };
    }

    function generateBotSnake(id) {
      const startX = Math.random() * (MAP_SIZE - 400) + 200;
      const startY = Math.random() * (MAP_SIZE - 400) + 200;
      const length = Math.floor(Math.random() * 20) + 12;
      const skinIndex = Math.floor(Math.random() * EMOJI_SKINS.length);
      
      let body = [];
      for (let i = 0; i < length; i++) {
        body.push({ x: startX, y: startY + i * 5 });
      }

      return {
        id: `bot_${id}`,
        name: BOT_NAMES[id - 1] || `لاعب ${id}`,
        isAlive: true,
        body: body,
        length: length,
        radius: 14,
        emoji: EMOJI_SKINS[skinIndex],
        color: BODY_COLORS[skinIndex % BODY_COLORS.length],
        angle: Math.random() * Math.PI * 2,
        changeDirTimer: 0,
        isBoosting: false
      };
    }

    function createExplosion(x, y, color, count = 6) {
      // تقليل عدد الجسيمات للحفاظ على السرعة الفائقة
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 2;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 2,
          color: color,
          alpha: 1
        });
      }
    }

    function initGame() {
      initAudio();
      const startX = MAP_SIZE / 2;
      const startY = MAP_SIZE / 2;

      playerSnake.isAlive = true;
      playerSnake.emoji = EMOJI_SKINS[selectedSkinIndex];
      playerSnake.color = BODY_COLORS[selectedSkinIndex % BODY_COLORS.length];
      playerSnake.body = [];
      playerSnake.length = 15;
      playerSnake.radius = 14;
      playerSnake.boostEnergy = 100;
      playerSnake.buffs = { magnet: 0, shield: 0, double: 0 };

      for (let i = 0; i < playerSnake.length; i++) {
        playerSnake.body.push({ x: startX, y: startY + i * 5 });
      }

      foods = [];
      for (let i = 0; i < FOOD_COUNT; i++) foods.push(generateFood());

      powerups = [];
      for (let i = 0; i < 4; i++) powerups.push(generatePowerup());

      botSnakes = [];
      for (let i = 0; i < TOTAL_BOTS; i++) botSnakes.push(generateBotSnake(i + 1));

      particles = [];
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      initGame();
      isPlaying = true;
    }

    function gameOver(isWin, reason) {
      isPlaying = false;
      const title = document.getElementById('endTitle');
      const sub = document.getElementById('endSubText');

      if (isWin) {
        playSound('win');
        title.innerHTML = '🏆 انتصار أسطوري! 🏆';
        title.style.background = 'linear-gradient(135deg, #eab308, #38bdf8)';
        title.style.webkitBackgroundClip = 'text';
        title.style.webkitTextFillColor = 'transparent';
        sub.innerHTML = `عاش يا بطل! قضيت على الجميع وصرت بطل الجولة بطول: <span style="color: #38bdf8">${Math.floor(playerSnake.length)}</span>`;
      } else {
        playSound('explode');
        title.innerHTML = 'انتهت الجولة! 💥';
        title.style.background = 'linear-gradient(135deg, #ef4444, #f97316)';
        title.style.webkitBackgroundClip = 'text';
        title.style.webkitTextFillColor = 'transparent';
        sub.innerHTML = `${reason || 'خسرت المعركة!'} طولك النهائي: <span style="color: #38bdf8">${Math.floor(playerSnake.length)}</span>`;
      }

      document.getElementById('finalScore').innerText = Math.floor(playerSnake.length);
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function explodeSnake(snake) {
      playSound('explode');
      snake.isAlive = false;
      snake.body.forEach((pt, index) => {
        if (index % 2 === 0) {
          foods.push(generateFood(pt.x + (Math.random() - 0.5) * 30, pt.y + (Math.random() - 0.5) * 30));
        }
        createExplosion(pt.x, pt.y, snake.color, 2);
      });
    }

    // دالة سريعة جدا لحساب المسافة المربعة للتخلص من ثقل Math.hypot
    function distSq(x1, y1, x2, y2) {
      const dx = x1 - x2;
      const dy = y1 - y2;
      return dx * dx + dy * dy;
    }

    function update() {
      if (!isPlaying) return;

      let aliveBots = botSnakes.filter(b => b.isAlive);
      let aliveTotal = aliveBots.length + (playerSnake.isAlive ? 1 : 0);
      document.getElementById('aliveCount').innerText = aliveTotal;

      if (playerSnake.isAlive && aliveBots.length === 0) {
        gameOver(true);
        return;
      }

      if (playerSnake.buffs.magnet > 0) playerSnake.buffs.magnet--;
      if (playerSnake.buffs.shield > 0) playerSnake.buffs.shield--;
      if (playerSnake.buffs.double > 0) playerSnake.buffs.double--;

      let activeBoost = isBoosting && playerSnake.boostEnergy > 5;
      let speed = activeBoost ? 4.0 : 2.3;

      if (activeBoost) {
        playerSnake.boostEnergy = Math.max(0, playerSnake.boostEnergy - 0.5);
      } else {
        playerSnake.boostEnergy = Math.min(100, playerSnake.boostEnergy + 0.25);
      }

      if (playerSnake.isAlive) {
        const head = { ...playerSnake.body[0] };
        const targetX = head.x + (mouse.x - canvas.width / 2);
        const targetY = head.y + (mouse.y - canvas.height / 2);

        const dx = targetX - head.x;
        const dy = targetY - head.y;
        const dSq = dx * dx + dy * dy;

        if (dSq > 9) {
          const dist = Math.sqrt(dSq);
          head.x += (dx / dist) * speed;
          head.y += (dy / dist) * speed;
        }

        if (head.x <= playerSnake.radius || head.x >= MAP_SIZE - playerSnake.radius || head.y <= playerSnake.radius || head.y >= MAP_SIZE - playerSnake.radius) {
          if (playerSnake.buffs.shield <= 0) {
            explodeSnake(playerSnake);
            gameOver(false, 'اصطدمت بالحدود الخارجية! 🛑');
            return;
          } else {
            head.x = Math.max(playerSnake.radius + 10, Math.min(MAP_SIZE - playerSnake.radius - 10, head.x));
            head.y = Math.max(playerSnake.radius + 10, Math.min(MAP_SIZE - playerSnake.radius - 10, head.y));
          }
        }

        playerSnake.body.unshift(head);
        while (playerSnake.body.length > playerSnake.length) playerSnake.body.pop();

        // أكل الطعام للاعب (محسّن بسرعات عالية)
        for (let i = foods.length - 1; i >= 0; i--) {
          const food = foods[i];
          let dSq = distSq(head.x, head.y, food.x, food.y);

          if (playerSnake.buffs.magnet > 0 && dSq < 62500) { // 250^2
            food.x += (head.x - food.x) * 0.1;
            food.y += (head.y - food.y) * 0.1;
          }

          const hitRadius = playerSnake.radius + food.radius;
          if (dSq < hitRadius * hitRadius) {
            let gain = playerSnake.buffs.double > 0 ? 2.4 : 1.2;
            playerSnake.length += gain;
            playSound('eat');
            createExplosion(food.x, food.y, '#22c55e', 3);
            foods[i] = generateFood();
          }
        }

        // أكل القدرات للاعب
        for (let i = powerups.length - 1; i >= 0; i--) {
          const p = powerups[i];
          const hitRadius = playerSnake.radius + p.radius;
          if (distSq(head.x, head.y, p.x, p.y) < hitRadius * hitRadius) {
            playSound('powerup');
            playerSnake.buffs[p.type] = 350;
            createExplosion(p.x, p.y, p.color, 8);
            powerups.splice(i, 1);
            setTimeout(() => powerups.push(generatePowerup()), 10000);
          }
        }
      }

      // ذكاء اصطناعي خفيف ومحسّن للبوتات
      aliveBots.forEach((bot) => {
        let botHead = { ...bot.body[0] };

        let danger = false;
        if (botHead.x < 180) { bot.angle = 0; danger = true; }
        else if (botHead.x > MAP_SIZE - 180) { bot.angle = Math.PI; danger = true; }
        else if (botHead.y < 180) { bot.angle = Math.PI / 2; danger = true; }
        else if (botHead.y > MAP_SIZE - 180) { bot.angle = -Math.PI / 2; danger = true; }

        if (!danger) {
          bot.changeDirTimer--;
          if (bot.changeDirTimer <= 0) {
            let closestTarget = null;
            let minDSq = 122500; // 350^2

            foods.forEach(f => {
              let dSq = distSq(botHead.x, botHead.y, f.x, f.y);
              if (dSq < minDSq) { minDSq = dSq; closestTarget = f; }
            });

            if (closestTarget) {
              bot.angle = Math.atan2(closestTarget.y - botHead.y, closestTarget.x - botHead.x);
            } else {
              bot.angle += (Math.random() - 0.5) * 1.2;
            }
            bot.changeDirTimer = Math.floor(Math.random() * 30) + 15;
          }
        }

        let botSpeed = bot.isBoosting ? 3.6 : 2.1;
        botHead.x += Math.cos(bot.angle) * botSpeed;
        botHead.y += Math.sin(bot.angle) * botSpeed;

        if (botHead.x <= bot.radius || botHead.x >= MAP_SIZE - bot.radius || botHead.y <= bot.radius || botHead.y >= MAP_SIZE - bot.radius) {
          explodeSnake(bot);
          return;
        }

        bot.body.unshift(botHead);
        while (bot.body.length > bot.length) bot.body.pop();

        for (let i = foods.length - 1; i >= 0; i--) {
          const f = foods[i];
          const hitRadius = bot.radius + f.radius;
          if (distSq(botHead.x, botHead.y, f.x, f.y) < hitRadius * hitRadius) {
            bot.length += 1.1;
            foods[i] = generateFood();
          }
        }

        // تصادامات محسنة أسرع 10 مرات بدون حسابات معقدة
        if (playerSnake.isAlive) {
          const hitRadius = (bot.radius + playerSnake.radius * 0.7);
          const hitR2 = hitRadius * hitRadius;

          for (let k = 0; k < playerSnake.body.length; k++) {
            if (distSq(botHead.x, botHead.y, playerSnake.body[k].x, playerSnake.body[k].y) < hitR2) {
              explodeSnake(bot);
              playerSnake.length += bot.length * 0.35;
              break;
            }
          }
        }

        if (playerSnake.isAlive && bot.isAlive) {
          const head = playerSnake.body[0];
          const hitRadius = (playerSnake.radius + bot.radius * 0.7);
          const hitR2 = hitRadius * hitRadius;

          for (let k = 0; k < bot.body.length; k++) {
            if (distSq(head.x, head.y, bot.body[k].x, bot.body[k].y) < hitR2) {
              if (playerSnake.buffs.shield > 0) {
                explodeSnake(bot);
              } else {
                explodeSnake(playerSnake);
                gameOver(false, 'اصطدمت بثعبان منافس! 💥');
              }
              break;
            }
          }
        }

        aliveBots.forEach(otherBot => {
          if (bot.id !== otherBot.id && bot.isAlive && otherBot.isAlive) {
            const hitRadius = (bot.radius + otherBot.radius * 0.7);
            const hitR2 = hitRadius * hitRadius;
            for (let k = 0; k < otherBot.body.length; k += 2) {
              if (distSq(botHead.x, botHead.y, otherBot.body[k].x, otherBot.body[k].y) < hitR2) {
                explodeSnake(bot);
                otherBot.length += bot.length * 0.3;
                break;
              }
            }
          }
        });
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      document.getElementById('score').innerText = Math.floor(playerSnake.length);
      document.getElementById('boostBar').style.width = `${playerSnake.boostEnergy}%`;
      document.getElementById('boostText').innerText = `${Math.floor(playerSnake.boostEnergy)}%`;

      let buffsText = [];
      if (playerSnake.buffs.magnet > 0) buffsText.push('🧲 مغناطيس');
      if (playerSnake.buffs.shield > 0) buffsText.push('🛡️ درع حماية');
      if (playerSnake.buffs.double > 0) buffsText.push('⚡ x2');
      document.getElementById('activeBuffs').innerText = buffsText.join(' | ');

      updateLeaderboard();
    }

    function updateLeaderboard() {
      let allSnakes = [];
      if (playerSnake.isAlive) allSnakes.push({ name: playerSnake.name, length: Math.floor(playerSnake.length) });
      
      botSnakes.forEach(b => {
        if (b.isAlive) allSnakes.push({ name: b.name, length: Math.floor(b.length) });
      });

      allSnakes.sort((a, b) => b.length - a.length);

      const lbList = document.getElementById('lb-list');
      lbList.innerHTML = '';
      allSnakes.slice(0, 5).forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'lb-item';
        div.style.color = item.name === playerSnake.name ? '#38bdf8' : '#fff';
        div.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${item.length}</span>`;
        lbList.appendChild(div);
      });
    }

    function drawSnake(ctx, snake, isPlayer = false) {
      if (!snake.isAlive || !snake.body || snake.body.length === 0) return;

      if (isPlayer && playerSnake.buffs.shield > 0) {
        const head = snake.body[0];
        ctx.beginPath();
        ctx.arc(head.x, head.y, snake.radius * 2.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(168, 85, 247, 0.2)';
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 2.5;
        ctx.fill();
        ctx.stroke();
      }

      ctx.fillStyle = snake.color;
      for (let i = snake.body.length - 1; i >= 1; i--) {
        const pt = snake.body[i];
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, snake.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      const head = snake.body[0];
      const next = snake.body[1] || head;
      const angle = Math.atan2(head.y - next.y, head.x - next.x);

      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.rotate(angle + Math.PI / 2);

      ctx.font = `${snake.radius * 2.2}px Segoe UI Emoji, Apple Color Emoji`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(snake.emoji, 0, 0);

      ctx.restore();
    }

    function drawMinimap() {
      miniCtx.clearRect(0, 0, 110, 110);
      const scale = 110 / MAP_SIZE;

      miniCtx.fillStyle = '#ef4444';
      botSnakes.forEach(b => {
        if (b.isAlive && b.body[0]) miniCtx.fillRect(b.body[0].x * scale, b.body[0].y * scale, 2.5, 2.5);
      });

      if (playerSnake.isAlive && playerSnake.body[0]) {
        miniCtx.fillStyle = '#38bdf8';
        miniCtx.beginPath();
        miniCtx.arc(playerSnake.body[0].x * scale, playerSnake.body[0].y * scale, 3.5, 0, Math.PI * 2);
        miniCtx.fill();
      }
    }

    function draw() {
      // تنظيف الخلفية بسرعة لعدم البطء
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!playerSnake.body[0]) return;

      const head = playerSnake.isAlive ? playerSnake.body[0] : { x: MAP_SIZE / 2, y: MAP_SIZE / 2 };
      const zoom = Math.max(0.6, 1 - playerSnake.length * 0.0007);

      const viewWidth = (canvas.width / zoom) / 2 + 100;
      const viewHeight = (canvas.height / zoom) / 2 + 100;

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-head.x, -head.y);

      // شبكة الخلفية
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
      ctx.lineWidth = 1.5;
      const gridSize = 120;
      const startX = Math.max(0, Math.floor((head.x - viewWidth) / gridSize) * gridSize);
      const endX = Math.min(MAP_SIZE, Math.ceil((head.x + viewWidth) / gridSize) * gridSize);
      const startY = Math.max(0, Math.floor((head.y - viewHeight) / gridSize) * gridSize);
      const endY = Math.min(MAP_SIZE, Math.ceil((head.y + viewHeight) / gridSize) * gridSize);

      ctx.beginPath();
      for (let x = startX; x <= endX; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE);
      }
      for (let y = startY; y <= endY; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, MAP_SIZE);
      }
      ctx.stroke();

      // الحدود
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      // رسم الطعام الظاهر على الشاشة فقط (Spatial Culling)
      foods.forEach(food => {
        if (Math.abs(food.x - head.x) < viewWidth && Math.abs(food.y - head.y) < viewHeight) {
          food.pulse += 0.05;
          const scale = 1 + Math.sin(food.pulse) * 0.08;
          ctx.save();
          ctx.translate(food.x, food.y);
          ctx.scale(scale, scale);
          ctx.font = '17px Segoe UI Emoji';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(food.icon, 0, 0);
          ctx.restore();
        }
      });

      // رسم القدرات
      powerups.forEach(p => {
        if (Math.abs(p.x - head.x) < viewWidth && Math.abs(p.y - head.y) < viewHeight) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius + 3, 0, Math.PI * 2);
          ctx.fillStyle = p.color + '33';
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 2;
          ctx.fill();
          ctx.stroke();

          ctx.font = '19px Segoe UI Emoji';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.icon, p.x, p.y);
          ctx.restore();
        }
      });

      // رسم الجسيمات
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      });

      botSnakes.forEach(bot => drawSnake(ctx, bot));
      if (playerSnake.isAlive) drawSnake(ctx, playerSnake, true);

      ctx.restore();

      drawMinimap();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
