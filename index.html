<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عبده.io - معرض الشخصيات المتقدم</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      background: #090d16;
      cursor: crosshair;
    }
    #ui {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 5;
    }
    #leaderboard {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 5;
      min-width: 180px;
    }
    #leaderboard h3 {
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }
    .lb-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 3rem;
      margin-bottom: 5px;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }
    .overlay p {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 15px;
    }
    /* معرض السكنات الضخم (+200 اختيار) */
    .skins-wrapper {
      max-width: 550px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      padding: 15px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 15px;
    }
    .skins-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding: 5px;
    }
    .skin-item {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .skin-item:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.15);
    }
    .skin-item.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 12px #38bdf8;
      transform: scale(1.12);
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    .page-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .page-btn.active {
      background: #0284c7;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>الطول: <span id="score">15</span></div>
    <div id="status" style="font-size: 12px; color: #eab308; margin-top:3px;">اضغط باستمرار للاندفاع ⚡</div>
  </div>

  <div id="leaderboard">
    <h3>🏆 المتصدرون</h3>
    <div id="lb-list"></div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>عبده.io 🚀</h1>
    <p>اختر شكل ثعبانك من بين أكثر من 200 شكل متاح!</p>
    
    <div class="skins-wrapper">
      <div class="skins-grid" id="skinsGrid"></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <button class="btn" onclick="startGame()">ابدأ اللعب الآن</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 style="color: #ef4444;" id="deathReason">انتهت اللعبة! 💥</h1>
    <p>وصل طولك النهائي إلى: <span id="finalScore">0</span></p>
    <button class="btn" onclick="startGame()">العب مرة أخرى</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // قائمة شاسعة من +200 رأس وشخصية (حيوانات، وحوش، فواكه، وجوه، فضائيين، أطعمة)
    const EMOJI_SKINS = [
      '🐍','🐉','🐲','🦁','🐯','🦊','🦝','🐻','🐼','🐨','🐰','🐱','🐶','🐺','🐵',
      '🤖','👽','👻','💀','☠️','👹','👺','😈','👿','🎃','🤡','💩','👾','🛸','🚀',
      '🦅','🦉','🦆','🐥','🐦','🐧','🦇','🦈','🐬','🐋','🐊','🐢','🦎','🐍','🐙',
      '🍏','🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍈','🍒','🍑','🥭','🍍',
      '🍔','🍕','🌭','🍿','🥞','🥐','🍩','🍪','🎂','🧁','🍦','🍨','🍧','🍫','🍬',
      '⚽','🏀','🏈','⚾','🎾','🏐','🏉','🎱','🏓','🏸','🥊','🥋','🎮','🕹️','🎰',
      '😃','😄','😁','😆','😅','😂','🤣','🥲','😊','😇','🙂','🙃','😉','😌','😍',
      '🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥸',
      '🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺',
      '😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓',
      '🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲',
      '🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠'
    ];

    const BODY_COLORS = ['#38bdf8', '#22c55e', '#a855f7', '#eab308', '#f43f5e', '#f97316', '#06b6d4', '#ec4899'];

    let selectedSkinIndex = 0;
    let currentPage = 0;
    const itemsPerPage = 24;

    let isBoosting = false;
    let isPlaying = false;
    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    const MAP_SIZE = 2800;
    const FOOD_COUNT = 400;
    const BOT_COUNT = 15;

    let playerSnake = {
      name: 'عبده',
      body: [],
      length: 15,
      radius: 14,
      emoji: EMOJI_SKINS[0],
      color: BODY_COLORS[0]
    };

    let foods = [];
    let botSnakes = [];

    // إعداد واجهة المعرض مع الصفحات
    function renderSkinsPage(page) {
      currentPage = page;
      const grid = document.getElementById('skinsGrid');
      grid.innerHTML = '';
      
      const start = page * itemsPerPage;
      const end = Math.min(start + itemsPerPage, EMOJI_SKINS.length);

      for (let i = start; i < end; i++) {
        const item = document.createElement('div');
        item.className = `skin-item ${i === selectedSkinIndex ? 'active' : ''}`;
        item.innerText = EMOJI_SKINS[i];
        item.onclick = () => {
          selectedSkinIndex = i;
          renderSkinsPage(currentPage);
        };
        grid.appendChild(item);
      }

      // رسم أزرار الصفحات
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';
      const totalPages = Math.ceil(EMOJI_SKINS.length / itemsPerPage);

      for (let p = 0; p < totalPages; p++) {
        const pBtn = document.createElement('button');
        pBtn.className = `page-btn ${p === currentPage ? 'active' : ''}`;
        pBtn.innerText = p + 1;
        pBtn.onclick = () => renderSkinsPage(p);
        pagination.appendChild(pBtn);
      }
    }

    renderSkinsPage(0);

    window.addEventListener('mousedown', () => isBoosting = true);
    window.addEventListener('mouseup', () => isBoosting = false);
    window.addEventListener('touchstart', () => isBoosting = true);
    window.addEventListener('touchend', () => isBoosting = false);

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    function initGame() {
      const startX = MAP_SIZE / 2;
      const startY = MAP_SIZE / 2;

      playerSnake.emoji = EMOJI_SKINS[selectedSkinIndex];
      playerSnake.color = BODY_COLORS[selectedSkinIndex % BODY_COLORS.length];
      playerSnake.body = [];
      playerSnake.length = 15;
      playerSnake.radius = 14;

      for (let i = 0; i < playerSnake.length; i++) {
        playerSnake.body.push({ x: startX, y: startY + i * 5 });
      }

      foods = [];
      for (let i = 0; i < FOOD_COUNT; i++) foods.push(generateFood());

      botSnakes = [];
      for (let i = 0; i < BOT_COUNT; i++) botSnakes.push(generateBotSnake(i + 1));
    }

    function generateFood(x, y, radius, color) {
      return {
        x: x || Math.random() * (MAP_SIZE - 100) + 50,
        y: y || Math.random() * (MAP_SIZE - 100) + 50,
        radius: radius || Math.random() * 3 + 5,
        color: color || BODY_COLORS[Math.floor(Math.random() * BODY_COLORS.length)]
      };
    }

    function generateBotSnake(id) {
      const startX = Math.random() * (MAP_SIZE - 200) + 100;
      const startY = Math.random() * (MAP_SIZE - 200) + 100;
      const length = Math.floor(Math.random() * 25) + 12;
      const skinIndex = Math.floor(Math.random() * EMOJI_SKINS.length);
      
      let body = [];
      for (let i = 0; i < length; i++) {
        body.push({ x: startX, y: startY + i * 5 });
      }

      return {
        name: `لاعب ${id}`,
        body: body,
        length: length,
        radius: 13,
        emoji: EMOJI_SKINS[skinIndex],
        color: BODY_COLORS[skinIndex % BODY_COLORS.length],
        angle: Math.random() * Math.PI * 2
      };
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      initGame();
      isPlaying = true;
    }

    function gameOver(reason) {
      isPlaying = false;
      document.getElementById('deathReason').innerText = reason || 'انتهت اللعبة!';
      document.getElementById('finalScore').innerText = Math.floor(playerSnake.length);
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function explodeSnake(snake) {
      snake.body.forEach(pt => {
        if (Math.random() < 0.6) {
          foods.push(generateFood(
            pt.x + (Math.random() - 0.5) * 20, 
            pt.y + (Math.random() - 0.5) * 20, 
            Math.random() * 5 + 7, 
            snake.color
          ));
        }
      });
    }

    function update() {
      if (!isPlaying) return;

      let speed = 2.2;

      if (isBoosting && playerSnake.length > 10) {
        speed = 4.2;
        playerSnake.length -= 0.08;
        if (Math.random() < 0.3) {
          const tail = playerSnake.body[playerSnake.body.length - 1];
          foods.push(generateFood(tail.x, tail.y, 4, playerSnake.color));
        }
      }

      const head = { ...playerSnake.body[0] };
      const targetX = head.x + (mouse.x - canvas.width / 2);
      const targetY = head.y + (mouse.y - canvas.height / 2);

      const dx = targetX - head.x;
      const dy = targetY - head.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 3) {
        head.x += (dx / dist) * speed;
        head.y += (dy / dist) * speed;
      }

      if (
        head.x <= playerSnake.radius || 
        head.x >= MAP_SIZE - playerSnake.radius || 
        head.y <= playerSnake.radius || 
        head.y >= MAP_SIZE - playerSnake.radius
      ) {
        explodeSnake(playerSnake);
        gameOver('اصطدمت بالحدود الحمراء! 🛑');
        return;
      }

      playerSnake.body.unshift(head);
      while (playerSnake.body.length > playerSnake.length) {
        playerSnake.body.pop();
      }

      foods.forEach((food, index) => {
        const d = Math.hypot(head.x - food.x, head.y - food.y);
        if (d < playerSnake.radius + food.radius) {
          playerSnake.length += 1.2;
          foods.splice(index, 1);
          foods.push(generateFood());
        }
      });

      botSnakes.forEach((bot, botIndex) => {
        let botHead = { ...bot.body[0] };
        
        if (Math.random() < 0.04) {
          bot.angle += (Math.random() - 0.5) * 1.5;
        }

        botHead.x += Math.cos(bot.angle) * 1.9;
        botHead.y += Math.sin(bot.angle) * 1.9;

        if (botHead.x < 50 || botHead.x > MAP_SIZE - 50) bot.angle = Math.PI - bot.angle;
        if (botHead.y < 50 || botHead.y > MAP_SIZE - 50) bot.angle = -bot.angle;

        bot.body.unshift(botHead);
        while (bot.body.length > bot.length) {
          bot.body.pop();
        }

        const d = Math.hypot(head.x - botHead.x, head.y - botHead.y);
        if (d < playerSnake.radius + bot.radius) {
          if (playerSnake.length >= bot.length) {
            explodeSnake(bot);
            playerSnake.length += bot.length * 0.4;
            botSnakes[botIndex] = generateBotSnake(botIndex + 1);
          } else {
            explodeSnake(playerSnake);
            gameOver('اصطدمت بثعبان أكبر منك! 🐍💥');
          }
        }
      });

      document.getElementById('score').innerText = Math.floor(playerSnake.length);
      updateLeaderboard();
    }

    function updateLeaderboard() {
      let allSnakes = [
        { name: playerSnake.name, length: Math.floor(playerSnake.length) },
        ...botSnakes.map(b => ({ name: b.name, length: Math.floor(b.length) }))
      ];

      allSnakes.sort((a, b) => b.length - a.length);

      const lbList = document.getElementById('lb-list');
      lbList.innerHTML = '';
      allSnakes.slice(0, 5).forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'lb-item';
        div.style.color = item.name === playerSnake.name ? '#38bdf8' : '#fff';
        div.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${item.length}</span>`;
        lbList.appendChild(div);
      });
    }

    // رسم الثعبان مع رأس الأيقونة المجسمة وتوجيهها
    function drawSnake(ctx, snake) {
      if (!snake.body || snake.body.length === 0) return;

      // رسم الجسم الملون
      for (let i = snake.body.length - 1; i >= 1; i--) {
        const pt = snake.body[i];
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, snake.radius, 0, Math.PI * 2);
        ctx.fillStyle = snake.color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // رسم الرأس برمز الشخصية البارز والعيون الحركية
      const head = snake.body[0];
      const next = snake.body[1] || head;
      const angle = Math.atan2(head.y - next.y, head.x - next.x);

      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.rotate(angle + Math.PI / 2); // تدوير الرأس نحو اتجاه الحركة

      ctx
