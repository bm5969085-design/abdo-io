<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عبده.io - لعبة الثعابين الاحترافية</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      background: #090d16;
      cursor: crosshair;
    }
    #ui {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 5;
    }
    /* لوحة المتصدرين */
    #leaderboard {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 5;
      min-width: 180px;
    }
    #leaderboard h3 {
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }
    .lb-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 3.2rem;
      margin-bottom: 5px;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }
    .overlay p {
      font-size: 1.05rem;
      color: #94a3b8;
      margin-bottom: 15px;
      max-width: 450px;
      line-height: 1.5;
    }
    /* اختيار السكنات */
    .skins-container {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
    }
    .skin-card {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .skin-card:hover {
      transform: scale(1.1);
    }
    .skin-card.active {
      border-color: #38bdf8;
      transform: scale(1.15);
      box-shadow: 0 0 15px #38bdf8;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- واجهة البيانات -->
  <div id="ui">
    <div>الطول: <span id="score">15</span></div>
    <div id="status" style="font-size: 12px; color: #eab308; margin-top:3px;">اضغط باستمرار للاندفاع ⚡</div>
  </div>

  <!-- لوحة الصدارة -->
  <div id="leaderboard">
    <h3>🏆 المتصدرون</h3>
    <div id="lb-list"></div>
  </div>

  <!-- شاشة البداية وسكنات الثعابين -->
  <div id="startScreen" class="overlay">
    <h1>عبده.io 🐍</h1>
    <p>اختر مظهر ثعبانك المفضّل وابدأ التنافس!</p>
    
    <div class="skins-container" id="skinsList"></div>

    <button class="btn" onclick="startGame()">ابدأ اللعب الآن</button>
  </div>

  <!-- شاشة الخسارة -->
  <div id="gameOverScreen" class="overlay hidden">
    <h1 style="color: #ef4444;" id="deathReason">انتهت اللعبة! 💥</h1>
    <p>وصل طولك النهائي إلى: <span id="finalScore">0</span></p>
    <button class="btn" onclick="startGame()">العب مرة أخرى</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // قائمة السكنات المتاحة
    const SKINS = [
      { id: 'cyan', name: 'النيون', head: '#0284c7', body: '#38bdf8' },
      { id: 'emerald', name: 'الزمرد', head: '#15803d', body: '#22c55e' },
      { id: 'purple', name: 'الفضاء', head: '#6b21a8', body: '#a855f7' },
      { id: 'gold', name: 'الذهبي', head: '#ca8a04', body: '#eab308' },
      { id: 'crimson', name: 'البركان', head: '#be123c', body: '#f43f5e' },
      { id: 'orange', name: 'النار', head: '#c2410c', body: '#f97316' }
    ];

    let selectedSkin = SKINS[0];
    let isBoosting = false;
    let isPlaying = false;
    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    const MAP_SIZE = 2800;
    const FOOD_COUNT = 400;
    const POWERUP_COUNT = 20;
    const BOT_COUNT = 15;

    let playerSnake = {
      name: 'عبده',
      body: [],
      length: 15,
      radius: 12,
      skin: selectedSkin
    };

    let foods = [];
    let powerups = [];
    let botSnakes = [];

    // إنشاء قائمة اختيار السكنات في شاشة البداية
    const skinsListEl = document.getElementById('skinsList');
    SKINS.forEach((skin, index) => {
      const card = document.createElement('div');
      card.className = `skin-card ${index === 0 ? 'active' : ''}`;
      card.style.background = `radial-gradient(circle, ${skin.body}, ${skin.head})`;
      card.innerText = skin.name;
      card.onclick = () => {
        document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedSkin = skin;
      };
      skinsListEl.appendChild(card);
    });

    // التحكم بالاندفاع السريع
    window.addEventListener('mousedown', () => isBoosting = true);
    window.addEventListener('mouseup', () => isBoosting = false);
    window.addEventListener('touchstart', () => isBoosting = true);
    window.addEventListener('touchend', () => isBoosting = false);

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    function initGame() {
      const startX = MAP_SIZE / 2;
      const startY = MAP_SIZE / 2;

      playerSnake.skin = selectedSkin;
      playerSnake.body = [];
      playerSnake.length = 15;
      playerSnake.radius = 12;

      for (let i = 0; i < playerSnake.length; i++) {
        playerSnake.body.push({ x: startX, y: startY + i * 5 });
      }

      foods = [];
      for (let i = 0; i < FOOD_COUNT; i++) foods.push(generateFood());

      powerups = [];
      for (let i = 0; i < POWERUP_COUNT; i++) powerups.push(generatePowerup());

      botSnakes = [];
      for (let i = 0; i < BOT_COUNT; i++) botSnakes.push(generateBotSnake(i + 1));
    }

    function generateFood(x, y, radius, color) {
      return {
        x: x || Math.random() * (MAP_SIZE - 100) + 50,
        y: y || Math.random() * (MAP_SIZE - 100) + 50,
        radius: radius || Math.random() * 3 + 5,
        color: color || SKINS[Math.floor(Math.random() * SKINS.length)].body
      };
    }

    function generatePowerup() {
      const types = ['speed', 'growth'];
      const type = types[Math.floor(Math.random() * types.length)];
      return {
        x: Math.random() * (MAP_SIZE - 100) + 50,
        y: Math.random() * (MAP_SIZE - 100) + 50,
        radius: 12,
        type: type,
        color: type === 'speed' ? '#eab308' : '#a855f7'
      };
    }

    function generateBotSnake(id) {
      const startX = Math.random() * (MAP_SIZE - 200) + 100;
      const startY = Math.random() * (MAP_SIZE - 200) + 100;
      const length = Math.floor(Math.random() * 25) + 12;
      const skin = SKINS[Math.floor(Math.random() * SKINS.length)];
      
      let body = [];
      for (let i = 0; i < length; i++) {
        body.push({ x: startX, y: startY + i * 5 });
      }

      return {
        name: `لاعب ${id}`,
        body: body,
        length: length,
        radius: 11,
        skin: skin,
        angle: Math.random() * Math.PI * 2
      };
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      initGame();
      isPlaying = true;
    }

    function gameOver(reason) {
      isPlaying = false;
      document.getElementById('deathReason').innerText = reason || 'انتهت اللعبة!';
      document.getElementById('finalScore').innerText = Math.floor(playerSnake.length);
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    // ترك نقاط طعام عند انفجار الثعبان
    function explodeSnake(snake) {
      snake.body.forEach(pt => {
        if (Math.random() < 0.6) {
          foods.push(generateFood(
            pt.x + (Math.random() - 0.5) * 20, 
            pt.y + (Math.random() - 0.5) * 20, 
            Math.random() * 5 + 7, 
            snake.skin.body
          ));
        }
      });
    }

    function update() {
      if (!isPlaying) return;

      let speed = 2.2;

      // الاندفاع السريع باستهلاك الطول
      if (isBoosting && playerSnake.length > 10) {
        speed = 4.2;
        playerSnake.length -= 0.08;
        if (Math.random() < 0.3) {
          const tail = playerSnake.body[playerSnake.body.length - 1];
          foods.push(generateFood(tail.x, tail.y, 4, playerSnake.skin.body));
        }
      }

      const head = { ...playerSnake.body[0] };
      const targetX = head.x + (mouse.x - canvas.width / 2);
      const targetY = head.y + (mouse.y - canvas.height / 2);

      const dx = targetX - head.x;
      const dy = targetY - head.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 3) {
        head.x += (dx / dist) * speed;
        head.y += (dy / dist) * speed;
      }

      // الحدود
      if (
        head.x <= playerSnake.radius || 
        head.x >= MAP_SIZE - playerSnake.radius || 
        head.y <= playerSnake.radius || 
        head.y >= MAP_SIZE - playerSnake.radius
      ) {
        explodeSnake(playerSnake);
        gameOver('اصطدمت بالحدود الحمراء! 🛑');
        return;
      }

      playerSnake.body.unshift(head);
      while (playerSnake.body.length > playerSnake.length) {
        playerSnake.body.pop();
      }

      // أكل الطعام
      foods.forEach((food, index) => {
        const d = Math.hypot(head.x - food.x, head.y - food.y);
        if (d < playerSnake.radius + food.radius) {
          playerSnake.length += 1.2;
          foods.splice(index, 1);
          foods.push(generateFood());
        }
      });

      // حركة الأعداء
      botSnakes.forEach((bot, botIndex) => {
        let botHead = { ...bot.body[0] };
        
        if (Math.random() < 0.04) {
          bot.angle += (Math.random() - 0.5) * 1.5;
        }

        botHead.x += Math.cos(bot.angle) * 1.9;
        botHead.y += Math.sin(bot.angle) * 1.9;

        if (botHead.x < 50 || botHead.x > MAP_SIZE - 50) bot.angle = Math.PI - bot.angle;
        if (botHead.y < 50 || botHead.y > MAP_SIZE - 50) bot.angle = -bot.angle;

        bot.body.unshift(botHead);
        while (bot.body.length > bot.length) {
          bot.body.pop();
        }

        // التصادم مع الأعداء
        const d = Math.hypot(head.x - botHead.x, head.y - botHead.y);
        if (d < playerSnake.radius + bot.radius) {
          if (playerSnake.length >= bot.length) {
            explodeSnake(bot);
            playerSnake.length += bot.length * 0.4;
            botSnakes[botIndex] = generateBotSnake(botIndex + 1);
          } else {
            explodeSnake(playerSnake);
            gameOver('اصطدمت بثعبان أكبر منك! 🐍💥');
          }
        }
      });

      document.getElementById('score').innerText = Math.floor(playerSnake.length);
      updateLeaderboard();
    }

    function updateLeaderboard() {
      let allSnakes = [
        { name: playerSnake.name, length: Math.floor(playerSnake.length) },
        ...botSnakes.map(b => ({ name: b.name, length: Math.floor(b.length) }))
      ];

      allSnakes.sort((a, b) => b.length - a.length);

      const lbList = document.getElementById('lb-list');
      lbList.innerHTML = '';
      allSnakes.slice(0, 5).forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'lb-item';
        div.style.color = item.name === playerSnake.name ? '#38bdf8' : '#fff';
        div.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${item.length}</span>`;
        lbList.appendChild(div);
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!playerSnake.body[0]) return;

      const head = playerSnake.body[0];

      // كاميرا مرنة تبتعد مع زيادة الطول
      const zoom = Math.max(0.6, 1 - playerSnake.length * 0.001);

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-head.x, -head.y);

      // رسم الشبكة والحدود
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1.5;
      const gridSize = 80;
      for (let x = 0; x < MAP_SIZE; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
      }
      for (let y = 0; y < MAP_SIZE; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
      }

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      // الطعام
      foods.forEach(food => {
        ctx.beginPath();
        ctx.arc(food.x, food.y, food.radius, 0, Math.PI * 2);
        ctx.fillStyle = food.color;
        ctx.fill();
      });

      // الثعابين الآلية
      botSnakes.forEach(bot => {
        for (let i = bot.body.length - 1; i >= 0; i--) {
          const pt = bot.body[i];
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, bot.radius, 0, Math.PI * 2);
          ctx.fillStyle = i === 0 ? bot.skin.head : bot.skin.body;
          ctx.fill();
        }
      });

      // ثعبان اللاعب
      if (isPlaying) {
        for (let i = playerSnake.body.length - 1; i >= 0; i--) {
          const pt = playerSnake.body[i];
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, playerSnake.radius, 0, Math.PI * 2);
          ctx.fillStyle = i === 0 ? playerSnake.skin.head : playerSnake.skin.body;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
