<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عبده.io - النسخة الأسطورية ⚡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      background: #030712;
      cursor: crosshair;
    }
    
    /* واجهة المستخدم UI */
    .hud-panel {
      position: absolute;
      color: #fff;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      pointer-events: none;
      z-index: 5;
    }

    #ui {
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 160px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
    }

    .boost-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .boost-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      transition: width 0.1s linear;
      box-shadow: 0 0 10px #f59e0b;
    }

    #leaderboard {
      top: 15px;
      left: 15px;
      min-width: 190px;
    }

    #leaderboard h3 {
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
      font-weight: 600;
    }

    /* الخريطة المصغرة */
    #minimapContainer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      z-index: 5;
    }

    #minimap {
      width: 100%;
      height: 100%;
    }

    /* شاشات البداية والنهاية */
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.92) 0%, rgba(3, 7, 18, 0.98) 100%);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .overlay h1 {
      font-size: 3.2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.4));
    }

    .overlay p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .skins-wrapper {
      max-width: 520px;
      width: 100%;
      background: rgba(30, 41, 59, 0.5);
      padding: 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
      margin-bottom: 25px;
    }

    .skins-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      max-height: 190px;
      overflow-y: auto;
      padding: 5px;
    }

    .skin-item {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .skin-item:hover {
      transform: translateY(-3px) scale(1.08);
      background: rgba(255, 255, 255, 0.15);
    }

    .skin-item.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      transform: scale(1.1);
    }
