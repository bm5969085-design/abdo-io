<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عبده.io - النسخة الأسطورية المتقدمة</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080c14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      background: #080c14;
      cursor: crosshair;
    }
    #ui {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 5;
    }
    #skills-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 6;
      background: rgba(15, 23, 42, 0.8);
      padding: 8px 15px;
      border-radius: 50px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .skill-btn {
      background: #1e293b;
      color: #fff;
      border: 2px solid #3b82f6;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .skill-btn:hover {
      transform: scale(1.1);
      background: #2563eb;
    }
    #leaderboard {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 5;
      min-width: 180px;
    }
    #leaderboard h3 {
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }
    .lb-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    .overlay h1 {
      font-size: 3rem;
      margin-bottom: 5px;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }
    .overlay p {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 15px;
    }
    .skins-wrapper {
      max-width: 550px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      padding: 15px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 15px;
    }
    .skins-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
      padding: 5px;
    }
    .skin-item {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .skin-item:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.15);
    }
    .skin-item.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 12px #38bdf8;
      transform: scale(1.12);
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    .page-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .page-btn.active {
      background: #0284c7;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>الطول: <span id="score">15</span></div>
    <div>المستوى: <span id="level">ثعبان برونزي 🐍</span></div>
  </div>

  <div id="skills-bar">
    <button class="skill-btn" onclick="useSkill('shield')" title="درع الحماية 🛡️">🛡️</button>
    <button class="skill-btn" onclick="useSkill('freeze')" title="تجميد ❄️">❄️</button>
    <button class="skill-btn" onclick="useSkill('clone')" title="نسخة وهمية 👥">👥</button>
    <button class="skill-btn" onclick="useSkill('blackhole')" title="ثقب أسود 🕳️">🕳️</button>
  </div>

  <div id="leaderboard">
    <h3>🏆 المتصدرون</h3>
    <div id="lb-list"></div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>عبده.io 🚀</h1>
    <p>اختر شكل ثعبانك وانطلق للتحدي السريع!</p>
    
    <div class="skins-wrapper">
      <div class="skins-grid" id="skinsGrid"></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <button class="btn" onclick="startGame()">ابدأ اللعب الآن</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 style="color: #ef4444;" id="deathReason">انتهت اللعبة! 💥</h1>
    <p>وصل طولك النهائي إلى: <span id="finalScore">0</span></p>
    <button class="btn" onclick="startGame()">العب مرة أخرى</button>
  </div>

  <canvas id="gameCanvas"></canvas>
