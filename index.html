<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عبده.io - النسخة السريعة الخفيفة 🚀</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080c14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      background: #080c14;
      cursor: crosshair;
    }
    
    /* واجهة المستخدم UI */
    .hud-panel {
      position: absolute;
      color: #fff;
      background: rgba(15, 23, 42, 0.85);
      padding: 10px 14px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      pointer-events: none;
      z-index: 5;
    }

    #ui {
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 140px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .boost-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 2px;
    }

    .boost-bar-fill {
      height: 100%;
      width: 100%;
      background: #f59e0b;
      transition: width 0.1s linear;
    }

    #leaderboard {
      top: 10px;
      left: 10px;
      min-width: 160px;
    }

    #leaderboard h3 {
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 6px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 3px;
      font-weight: 600;
    }

    /* الخريطة المصغرة */
    #minimapContainer {
      position: absolute;
      bottom: 15px;
      left: 15px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.5);
      background: rgba(15, 23, 42, 0.85);
      z-index: 5;
    }

    #minimap {
      width: 100%;
      height: 100%;
    }

    /* شاشات البداية والنهاية */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    .overlay h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
      color: #38bdf8;
    }

    .overlay p {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .skins-wrapper {
      max-width: 450px;
      width: 100%;
      background: rgba(30, 41, 59, 0.6);
      padding: 15px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .skins-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      max-height: 160px;
      overflow-y: auto;
      padding: 4px;
    }

    .skin-item {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
    }

    .skin-item.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.25);
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .page-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .page-btn.active {
      background: #0284c7;
    }

    .btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 12px 36px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }

    .hidden {
      display: none !important;
    }

    /* أزرار التحكم بالموبايل */
    #mobileBoostBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #f59e0b;
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 8;
      touch-action: manipulation;
      border: 2px solid rgba(255,255,255,0.5);
      display: none;
    }

    @media (max-width: 768px) {
      #mobileBoostBtn { display: flex; }
    }
  </style>
</head>
<body>

  <div id="ui" class="hud-panel">
    <div class="stat-row">
      <span>الطول:</span>
      <span id="score" style="color: #38bdf8;">15</span>
    </div>
    <div class="stat-row">
      <span>التعزيز:</span>
      <span id="boostText" style="color: #f59e0b;">100%</span>
    </div>
    <div class="boost-bar-container">
      <div id="boostBar" class="boost-bar-fill"></div>
    </div>
    <div id="activeBuffs" style="font-size: 11px; color: #a855f7; margin-top:2px;"></div>
  </div>

  <div id="leaderboard" class="hud-panel">
    <h3>🏆 أساطير الساحة</h3>
    <div id="lb-list"></div>
  </div>

  <div id="minimapContainer">
    <canvas id="minimap"></canvas>
  </div>

  <div id="startScreen" class="overlay">
    <h1>عبده.io 🚀</h1>
    <p>اختر مظهرك وانطلق للعب بسرعة وسلاسة!</p>
    
    <div class="skins-wrapper">
      <div class="skins-grid" id="skinsGrid"></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <button class="btn" onclick="startGame()">ابدأ اللعب الآن 🔥</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 style="color: #ef4444;" id="deathReason">انتهت الجولة! 💥</h1>
    <p>النتيجة النهائية: <span id="finalScore" style="color: #38bdf8; font-weight: bold;">0</span></p>
    <button class="btn" onclick="startGame()">العب مرة أخرى 🔄</button>
  </div>

  <div id="mobileBoostBtn">⚡</div>

  <canvas id="gameCanvas"></canvas>

  <script>
    // --- الصوت الديناميكي البسيط جداً ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'eat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'powerup') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'explode') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    // --- إعدادات الكانفاس واللعبة ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const miniCtx = minimapCanvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      minimapCanvas.width = 90;
      minimapCanvas.height = 90;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const FOOD_ITEMS = ['🍔','🍕','🍟','🌮','🍩','🍏','🍎','🍌','🍉','🍇','🍓'];
    const POWERUP_TYPES = [
      { type: 'magnet', icon: '🧲', color: '#38bdf8' },
      { type: 'shield', icon: '🛡️', color: '#a855f7' },
      { type: 'double', icon: '⚡', color: '#eab308' }
    ];

    const EMOJI_SKINS = ['🐍','🐉','🐲','🦁','🐯','🦊','🐻','🐼','🐰','🐱','🐶','🤖','👽','👻','💀','👾','🛸','🚀'];
    const BODY_COLORS = ['#38bdf8', '#22c55e', '#a855f7', '#eab308', '#f43f5e', '#f97316'];

    let selectedSkinIndex = 0;
    let currentPage = 0;
    const itemsPerPage = 18;

    let isBoosting = false;
    let isPlaying = false;

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    const MAP_SIZE = 2400; // تصغير الخريطة قليلاً لسرعة الفحص
    const FOOD_COUNT = 150; // تقليل عدد الأكل للأداء العالي
    const BOT_COUNT = 8;    // عدد للبوتات مثالي وبدون تقطيع

    let foods = [];
    let powerups = [];
    let botSnakes = [];

    let playerSnake = {
      name: 'عبده',
      body: [],
      length: 15,
      radius: 13,
      emoji: EMOJI_SKINS[0],
      color: BODY_COLORS[0],
      boostEnergy: 100,
      buffs: { magnet: 0, shield: 0, double: 0 }
    };

    function renderSkinsPage(page) {
      currentPage = page;
      const grid = document.getElementById('skinsGrid');
      grid.innerHTML = '';
      
      const start = page * itemsPerPage;
      const end = Math.min(start + itemsPerPage, EMOJI_SKINS.length);

      for (let i = start; i < end; i++) {
        const item = document.createElement('div');
        item.className = `skin-item ${i === selectedSkinIndex ? 'active' : ''}`;
        item.innerText = EMOJI_SKINS[i];
        item.onclick = () => {
          selectedSkinIndex = i;
          renderSkinsPage(currentPage);
        };
        grid.appendChild(item);
      }

      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';
      const totalPages = Math.ceil(EMOJI_SKINS.length / itemsPerPage);

      for (let p = 0; p < totalPages; p++) {
        const pBtn = document.createElement('button');
        pBtn.className = `page-btn ${p === currentPage ? 'active' : ''}`;
        pBtn.innerText = p + 1;
        pBtn.onclick = () => renderSkinsPage(p);
        pagination.appendChild(pBtn);
      }
    }
    renderSkinsPage(0);

    window.addEventListener('mousedown', () => isBoosting = true);
    window.addEventListener('mouseup', () => isBoosting = false);
    
    const boostBtn = document.getElementById('mobileBoostBtn');
    boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
    boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; });

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    function generateFood(x, y) {
      return {
        x: x || Math.random() * (MAP_SIZE - 100) + 50,
        y: y || Math.random() * (MAP_SIZE - 100) + 50,
        icon: FOOD_ITEMS[Math.floor(Math.random() * FOOD_ITEMS.length)],
        radius: 9
      };
    }

    function generatePowerup() {
      const p = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
      return {
        x: Math.random() * (MAP_SIZE - 200) + 100,
        y: Math.random() * (MAP_SIZE - 200) + 100,
        type: p.type,
        icon: p.icon,
        color: p.color,
        radius: 14
      };
    }

    function generateBotSnake(id) {
      const startX = Math.random() * (MAP_SIZE - 200) + 100;
      const startY = Math.random() * (MAP_SIZE - 200) + 100;
      const length = Math.floor(Math.random() * 20) + 10;
      const skinIndex = Math.floor(Math.random() * EMOJI_SKINS.length);
      
      let body = [];
      for (let i = 0; i < length; i++) {
        body.push({ x: startX, y: startY + i * 5 });
      }

      return {
        id: `bot_${id}`,
        name: `لاعب ${id}`,
        body: body,
        length: length,
        radius: 13,
        emoji: EMOJI_SKINS[skinIndex],
        color: BODY_COLORS[skinIndex % BODY_COLORS.length],
        angle: Math.random() * Math.PI * 2,
        changeDirTimer: 0
      };
    }

    function initGame() {
      initAudio();
      const startX = MAP_SIZE / 2;
      const startY = MAP_SIZE / 2;

      playerSnake.emoji = EMOJI_SKINS[selectedSkinIndex];
      playerSnake.color = BODY_COLORS[selectedSkinIndex % BODY_COLORS.length];
      playerSnake.body = [];
      playerSnake.length = 15;
      playerSnake.radius = 13;
      playerSnake.boostEnergy = 100;
      playerSnake.buffs = { magnet: 0, shield: 0, double: 0 };

      for (let i = 0; i < playerSnake.length; i++) {
        playerSnake.body.push({ x: startX, y: startY + i * 5 });
      }

      foods = [];
      for (let i = 0; i < FOOD_COUNT; i++) foods.push(generateFood());

      powerups = [];
      for (let i = 0; i < 3; i++) powerups.push(generatePowerup());

      botSnakes = [];
      for (let i = 0; i < BOT_COUNT; i++) botSnakes.push(generateBotSnake(i + 1));
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      initGame();
      isPlaying = true;
    }

    function gameOver(reason) {
      isPlaying = false;
      playSound('explode');
      document.getElementById('deathReason').innerText = reason || 'انتهت الجولة!';
      document.getElementById('finalScore').innerText = Math.floor(playerSnake.length);
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function explodeSnake(snake) {
      playSound('explode');
      snake.body.forEach((pt, index) => {
        if (index % 3 === 0) {
          foods.push(generateFood(pt.x + (Math.random() - 0.5) * 20, pt.y + (Math.random() - 0.5) * 20));
        }
      });
    }

    function update() {
      if (!isPlaying) return;

      if (playerSnake.buffs.magnet > 0) playerSnake.buffs.magnet--;
      if (playerSnake.buffs.shield > 0) playerSnake.buffs.shield--;
      if (playerSnake.buffs.double > 0) playerSnake.buffs.double--;

      let activeBoost = isBoosting && playerSnake.boostEnergy > 5;
      let speed = activeBoost ? 3.8 : 2.2;

      if (activeBoost) {
        playerSnake.boostEnergy = Math.max(0, playerSnake.boostEnergy - 0.5);
      } else {
        playerSnake.boostEnergy = Math.min(100, playerSnake.boostEnergy + 0.2);
      }

      const head = { ...playerSnake.body[0] };
      const targetX = head.x + (mouse.x - canvas.width / 2);
      const targetY = head.y + (mouse.y - canvas.height / 2);

      const dx = targetX - head.x;
      const dy = targetY - head.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 3) {
        head.x += (dx / dist) * speed;
        head.y += (dy / dist) * speed;
      }

      if (head.x <= playerSnake.radius || head.x >= MAP_SIZE - playerSnake.radius || head.y <= playerSnake.radius || head.y >= MAP_SIZE - playerSnake.radius) {
        if (playerSnake.buffs.shield <= 0) {
          explodeSnake(playerSnake);
          gameOver('اصطدمت بالحدود! 🛑');
          return;
        } else {
          head.x = Math.max(playerSnake.radius + 5, Math.min(MAP_SIZE - playerSnake.radius - 5, head.x));
          head.y = Math.max(playerSnake.radius + 5, Math.min(MAP_SIZE - playerSnake.radius - 5, head.y));
        }
      }

      playerSnake.body.unshift(head);
      while (playerSnake.body.length > playerSnake.length) playerSnake.body.pop();

      // فحص أكل الطعام باحترافية وسرعة بدون إرهاق الجهاز
      for (let i = foods.length - 1; i >= 0; i--) {
        const food = foods[i];
        let foodDist = Math.hypot(head.x - food.x, head.y - food.y);

        if (playerSnake.buffs.magnet > 0 && foodDist < 200) {
          food.x += (head.x - food.x) * 0.1;
          food.y += (head.y - food.y) * 0.1;
        }

        if (foodDist < playerSnake.radius + food.radius) {
          let gain = playerSnake.buffs.double > 0 ? 2.4 : 1.2;
          playerSnake.length += gain;
          playSound('eat');
          foods[i] = generateFood();
        }
      }

      // أكل القدرات Power-ups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        const d = Math.hypot(head.x - p.x, head.y - p.y);
        if (d < playerSnake.radius + p.radius) {
          playSound('powerup');
          playerSnake.buffs[p.type] = 300;
          powerups.splice(i, 1);
          setTimeout(() => powerups.push(generatePowerup()), 12000);
        }
      }

      // تحريك البوتات
      botSnakes.forEach((bot, botIndex) => {
        let botHead = { ...bot.body[0] };

        bot.changeDirTimer--;
        if (bot.changeDirTimer <= 0) {
          bot.angle += (Math.random() - 0.5) * 1.5;
          bot.changeDirTimer = Math.floor(Math.random() * 40) + 20;
        }

        if (botHead.x < 100) bot.angle = 0;
        if (botHead.x > MAP_SIZE - 100) bot.angle = Math.PI;
        if (botHead.y < 100) bot.angle = Math.PI / 2;
        if (botHead.y > MAP_SIZE - 100) bot.angle = -Math.PI / 2;

        botHead.x += Math.cos(bot.angle) * 1.8;
        botHead.y += Math.sin(bot.angle) * 1.8;

        bot.body.unshift(botHead);
        while (bot.body.length > bot.length) bot.body.pop();

        // تصادم البوت بك
        playerSnake.body.forEach(segment => {
          const d = Math.hypot(botHead.x - segment.x, botHead.y - segment.y);
          if (d < bot.radius + playerSnake.radius * 0.6) {
            explodeSnake(bot);
            playerSnake.length += bot.length * 0.3;
            botSnakes[botIndex] = generateBotSnake(botIndex + 1);
          }
        });

        // تصادمك بالبوت
        bot.body.forEach(segment => {
          const d = Math.hypot(head.x - segment.x, head.y - segment.y);
          if (d < playerSnake.radius + bot.radius * 0.6) {
            if (playerSnake.buffs.shield > 0) {
              explodeSnake(bot);
              botSnakes[botIndex] = generateBotSnake(botIndex + 1);
            } else {
              explodeSnake(playerSnake);
              gameOver('اصطدمت بثعبان آخر! 💥');
            }
          }
        });
      });

      document.getElementById('score').innerText = Math.floor(playerSnake.length);
      document.getElementById('boostBar').style.width = `${playerSnake.boostEnergy}%`;
      document.getElementById('boostText').innerText = `${Math.floor(playerSnake.boostEnergy)}%`;

      let buffsText = [];
      if (playerSnake.buffs.magnet > 0) buffsText.push('🧲 مغناطيس');
      if (playerSnake.buffs.shield > 0) buffsText.push('🛡️ درع');
      if (playerSnake.buffs.double > 0) buffsText.push('⚡ x2');
      document.getElementById('activeBuffs').innerText = buffsText.join(' | ');

      updateLeaderboard();
    }

    function updateLeaderboard() {
      let allSnakes = [
        { name: playerSnake.name, length: Math.floor(playerSnake.length) },
        ...botSnakes.map(b => ({ name: b.name, length: Math.floor(b.length) }))
      ];

      allSnakes.sort((a, b) => b.length - a.length);

      const lbList = document.getElementById('lb-list');
      lbList.innerHTML = '';
      allSnakes.slice(0, 5).forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'lb-item';
        div.style.color = item.name === playerSnake.name ? '#38bdf8' : '#fff';
        div.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${item.length}</span>`;
        lbList.appendChild(div);
      });
    }

    function drawSnake(ctx, snake, isPlayer = false) {
      if (!snake.body || snake.body.length === 0) return;

      // درع الحماية بدون تأثيرات ثقيلة
      if (isPlayer && playerSnake.buffs.shield > 0) {
        const head = snake.body[0];
        ctx.beginPath();
        ctx.arc(head.x, head.y, snake.radius * 2, 0, Math.PI * 2);
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // رسم الجسم بدون shadowBlur لتسريع الأداء
      ctx.fillStyle = snake.color;
      for (let i = snake.body.length - 1; i >= 1; i--) {
        const pt = snake.body[i];
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, snake.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // رسم الرأس
      const head = snake.body[0];
      const next = snake.body[1] || head;
      const angle = Math.atan2(head.y - next.y, head.x - next.x);

      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.rotate(angle + Math.PI / 2);

      ctx.font = `${snake.radius * 2.1}px Segoe UI Emoji, Apple Color Emoji`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(snake.emoji, 0, 0);

      ctx.restore();
    }

    function drawMinimap() {
      miniCtx.clearRect(0, 0, 90, 90);
      const scale = 90 / MAP_SIZE;

      miniCtx.fillStyle = '#ef4444';
      botSnakes.forEach(b => {
        if (b.body[0]) miniCtx.fillRect(b.body[0].x * scale, b.body[0].y * scale, 2.5, 2.5);
      });

      if (playerSnake.body[0]) {
        miniCtx.fillStyle = '#38bdf8';
        miniCtx.beginPath();
        miniCtx.arc(playerSnake.body[0].x * scale, playerSnake.body[0].y * scale, 3, 0, Math.PI * 2);
        miniCtx.fill();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!playerSnake.body[0]) return;

      const head = playerSnake.body[0];
      const zoom = Math.max(0.6, 1 - playerSnake.length * 0.0006);

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-head.x, -head.y);

      // رسم الشبكة البسيطة الخفيفة
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 150;
      for (let x = 0; x < MAP_SIZE; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
      }
      for (let y = 0; y < MAP_SIZE; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, MAP_SIZE); ctx.stroke();
      }

      // الحدود
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 8;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      // رسم الطعام
      ctx.font = '16px Segoe UI Emoji';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      foods.forEach(food => {
        ctx.fillText(food.icon, food.x, food.y);
      });

      // رسم القدرات
      powerups.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = '18px Segoe UI Emoji';
        ctx.fillText(p.icon, p.x, p.y);
      });

      botSnakes.forEach(bot => drawSnake(ctx, bot));
      if (isPlaying) drawSnake(ctx, playerSnake, true);

      ctx.restore();

      drawMinimap();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
